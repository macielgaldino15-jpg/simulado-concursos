do."],"c":3,"w":"Poder de polícia: limita direitos individuais em favor do interesse público (art. 78 do CTN)."}]],"adm":[[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a palavra \"mesmo\" está corretamente empregada:","o":["Nós mesmo, as servidoras, fizemos.","Elas mesmas fizeram o relatório.","Elas mesmos fizeram o relatório.","Ele mesma fez o relatório.","Ela mesmos fez o relatório."],"c":1,"w":"\"Mesmo\", com valor de reforço (= próprio), concorda com o termo a que se refere. Como advérbio (= realmente), é invariável."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a regência do verbo \"assistir\" está de acordo com a norma-padrão:","o":["Os servidores assistiram a palestra sobre segurança viária.","Os servidores assistiram com a palestra sobre segurança viária.","Os servidores assistiram à palestra sobre segurança viária.","Os servidores assistiram na palestra sobre segurança viária.","Os servidores assistiram da palestra sobre segurança viária."],"c":2,"w":"\"Assistir\", no sentido de ver ou presenciar, é transitivo indireto e exige a preposição \"a\". No sentido de prestar assistência, é transitivo direto: \"o médico assistiu o ferido\"."},{"s":"Ética e Conduta Pública","t":"A afirmação \"aquilo que uma sociedade considera aceitável pode mudar com o tempo\" refere-se mais diretamente ao caráter:","o":["exclusivamente individual da ética","imutável dos valores éticos","técnico da administração pública","histórico e cultural da moral","absoluto da legislação penal"],"c":3,"w":"As normas morais variam conforme a época e o grupo social."},{"s":"Raciocínio Lógico","t":"A bicondicional \"p ↔ q\" é verdadeira quando:","o":["p é verdadeira, qualquer que seja q","apenas q é falsa","apenas p é verdadeira","p e q têm valores lógicos diferentes","p e q têm o mesmo valor lógico"],"c":4,"w":"A bicondicional é verdadeira quando ambas são verdadeiras ou ambas são falsas."},{"s":"Noções de Direito Constitucional","t":"Quanto à forma, a Constituição Federal de 1988 é classificada como:","o":["histórica","não escrita","escrita","consuetudinária","costumeira"],"c":2,"w":"A CF/1988 é um texto codificado e sistematizado, por isso é escrita."},{"s":"Noções de Direito Administrativo","t":"A distribuição interna de competências entre órgãos de uma mesma pessoa jurídica, com hierarquia, denomina-se:","o":["terceirização","delegação legislativa","desconcentração","descentralização","privatização"],"c":2,"w":"Na desconcentração, cria-se um órgão dentro da mesma pessoa. Na descentralização, transfere-se a atividade a outra pessoa jurídica."},{"s":"Noções de Administração","t":"Na EaD, a comunicação que ocorre ao mesmo tempo, em tempo real, como em uma videoconferência ao vivo, é chamada de:","o":["unidirecional, obrigatoriamente","assíncrona","off-line","síncrona","presencial"],"c":3,"w":"Comunicação síncrona acontece em tempo real. A assíncrona, como fóruns e e-mails, permite interação em momentos diferentes."},{"s":"Noções de Arquivologia","t":"Na diplomática e na arquivística, ata, ofício, certidão e requerimento são exemplos de:","o":["formatos","gêneros iconográficos","suportes","fundos","espécies documentais"],"c":4,"w":"A espécie é a configuração que o documento assume segundo a disposição e a natureza das informações. Somada à atividade, forma o tipo documental, como \"ata de reunião de comissão\"."},{"s":"Noções de Informática","t":"O formato de arquivo padrão do LibreOffice Writer é o:","o":[".docx",".odp",".txt",".ods",".odt"],"c":4,"w":"O Writer usa o formato aberto ODF de texto (.odt). O Calc usa .ods e o Impress, .odp."},{"s":"Legislação Relativa à PRF","t":"Conforme o art. 144, § 2º, da Constituição Federal, a Polícia Rodoviária Federal é órgão permanente, organizado e mantido pela União e estruturado em carreira, que se destina, na forma da lei:","o":["à apuração de infrações penais militares","ao patrulhamento ostensivo das ferrovias federais","à polícia marítima, aeroportuária e de fronteiras","ao patrulhamento ostensivo das rodovias federais","às funções de polícia judiciária da União"],"c":3,"w":"O § 2º atribui à PRF o patrulhamento ostensivo das rodovias federais. Polícia judiciária da União e polícia de fronteiras são funções da Polícia Federal (§ 1º); as ferrovias cabem à Polícia Ferroviária Federal (§ 3º)."}],[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a regência nominal está correta:","o":["O servidor é apto com a função e tem aversão de injustiças.","O servidor é apto da função e tem aversão com injustiças.","O servidor é apto para a função e tem aversão a injustiças.","O servidor é apto pela função e tem aversão em injustiças.","O servidor é apto em a função e tem aversão para injustiças."],"c":2,"w":"Diz-se \"apto a\" ou \"apto para\" e \"aversão a\" ou \"aversão por\"."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o acento gráfico foi mantido corretamente pelo Acordo Ortográfico:","o":["jóia, idéia e platéia","feiúra, baiúca e bocaiúva","herói, chapéu e anéis","pára (verbo), pêlo (substantivo) e pólo","vôo, enjôo e crêem"],"c":2,"w":"Os ditongos abertos \"éi\", \"éu\" e \"ói\" continuam acentuados nas oxítonas e monossílabos tônicos: herói, chapéu, anéis."},{"s":"Ética e Conduta Pública","t":"Um servidor percebe que um colega altera dados de um processo para favorecer um conhecido. A atitude ética e legal é:","o":["divulgar o caso nas redes sociais antes de comunicar o órgão","pedir parte do benefício","ignorar para preservar a amizade","fazer o mesmo em outro processo","comunicar o fato à autoridade competente"],"c":4,"w":"O servidor tem o dever de levar irregularidades ao conhecimento da autoridade competente (art. 116, VI, da Lei nº 8.112/1990)."},{"s":"Raciocínio Lógico","t":"Premissas: \"Todo policial rodoviário federal é servidor público\" e \"Todo servidor público deve obedecer à lei\". Conclusão válida:","o":["Algum policial rodoviário federal não deve obedecer à lei.","Nenhum servidor público é policial rodoviário federal.","Quem obedece à lei é policial rodoviário federal.","Todo policial rodoviário federal deve obedecer à lei.","Todo servidor público é policial rodoviário federal."],"c":3,"w":"Por transitividade de conjuntos, se A ⊂ B e B ⊂ C, então A ⊂ C."},{"s":"Noções de Direito Constitucional","t":"NÃO é cláusula pétrea, segundo o art. 60, § 4º, da Constituição:","o":["a forma republicana de governo","o voto direto, secreto, universal e periódico","os direitos e garantias individuais","a forma federativa de Estado","a separação dos Poderes"],"c":0,"w":"A república não consta expressamente do § 4º do art. 60. Ela foi confirmada pelo plebiscito de 1993."},{"s":"Noções de Direito Administrativo","t":"A interdição de um estabelecimento que vende alimentos estragados, feita pela própria administração sem ordem judicial prévia, exemplifica o atributo da:","o":["motivação","tipicidade","imperatividade apenas","presunção de legitimidade","autoexecutoriedade"],"c":4,"w":"A autoexecutoriedade permite executar o ato por meios próprios, quando a lei autoriza ou em situação de urgência."},{"s":"Noções de Direito Administrativo","t":"O poder de distribuir e escalonar funções, ordenar e rever a atuação dos subordinados, delegar e avocar competências é o poder:","o":["hierárquico","de polícia","disciplinar","regulamentar","discricionário puro"],"c":0,"w":"O poder hierárquico organiza as relações de subordinação dentro da administração."},{"s":"Noções de Administração","t":"Um fórum de discussão em um ambiente virtual de aprendizagem, em que os participantes postam mensagens em horários diferentes, é exemplo de ferramenta:","o":["assíncrona","sem interação","de avaliação de reação apenas","exclusivamente presencial","síncrona"],"c":0,"w":"Fóruns permitem a participação em tempos diferentes, característica da comunicação assíncrona."},{"s":"Noções de Arquivologia","t":"Um conjunto de objetos e documentos reunidos artificialmente por um colecionador, segundo um tema, sem relação orgânica com as atividades de uma instituição, constitui:","o":["um arquivo intermediário","uma série documental orgânica","uma coleção","um arquivo corrente","um fundo de arquivo"],"c":2,"w":"A coleção é reunida artificialmente, diferentemente do fundo, que se forma naturalmente pelas atividades da instituição."},{"s":"Noções de Informática","t":"Um ataque que deixa o sistema de agendamento do órgão fora do ar por excesso de requisições compromete principalmente a:","o":["confidencialidade","disponibilidade","integridade","autenticidade","legalidade"],"c":1,"w":"Ataques de negação de serviço (DoS e DDoS) impedem o acesso dos usuários legítimos, afetando a disponibilidade."}],[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a regência nominal está de acordo com a norma-padrão:","o":["O motorista era favorável da mudança e estava ansioso com notícias.","O motorista era favorável à mudança e estava ansioso por notícias.","O motorista era favorável pela mudança e estava ansioso em notícias.","O motorista era favorável na mudança e estava ansioso a notícias.","O motorista era favorável com a mudança e estava ansioso de notícias."],"c":1,"w":"Diz-se \"favorável a\" e \"ansioso por\" ou \"ansioso de\"."},{"s":"Ética e Conduta Pública","t":"Permitir ou facilitar que terceiro enriqueça ilicitamente, quando o ato causar perda patrimonial efetiva à administração, é ato de improbidade que:","o":["importa enriquecimento ilícito do agente, obrigatoriamente","causa lesão ao erário","é infração apenas ética","atenta apenas contra os princípios","não configura improbidade"],"c":1,"w":"O art. 10, XII, trata como lesão ao erário a conduta de permitir ou facilitar o enriquecimento ilícito de terceiro."},{"s":"Ética e Conduta Pública","t":"A pena aplicável ao servidor pela Comissão de Ética, nos termos do Decreto nº 1.171/1994, é a de:","o":["demissão","advertência verbal sem registro","censura","multa","suspensão de 30 dias"],"c":2,"w":"O item XXII do Código prevê a censura, com fundamentação no parecer assinado pelos integrantes da Comissão e ciência do faltoso."},{"s":"Raciocínio Lógico","t":"A negação de \"Algum veículo foi multado\" é:","o":["Nenhum veículo foi multado.","Pelo menos um veículo foi multado.","Nem todo veículo foi multado.","Todos os veículos foram multados.","Algum veículo não foi multado."],"c":0,"w":"A negação de \"algum A é B\" é \"nenhum A é B\"."},{"s":"Noções de Direito Constitucional","t":"A República Federativa do Brasil rege-se, nas suas relações internacionais, entre outros, pelo princípio da:","o":["erradicação da pobreza","cidadania","dignidade da pessoa humana, como fundamento interno apenas","prevalência dos direitos humanos","livre iniciativa"],"c":3,"w":"O art. 4º lista os princípios das relações internacionais, como independência nacional, prevalência dos direitos humanos, autodeterminação dos povos e repúdio ao terrorismo."},{"s":"Noções de Direito Administrativo","t":"O controle que a própria administração exerce sobre seus atos, anulando os ilegais e revogando os inconvenientes, é o controle:","o":["social","judicial","administrativo (autotutela)","legislativo","externo pelo Tribunal de Contas"],"c":2,"w":"O controle administrativo decorre da autotutela e pode ser provocado ou feito de ofício."},{"s":"Noções de Administração","t":"No modelo de avaliação de treinamento de Kirkpatrick, o primeiro nível, que mede a satisfação dos participantes com o curso, é o de:","o":["aprendizagem","reação","comportamento no cargo","resultados organizacionais","retorno financeiro"],"c":1,"w":"Os níveis de Kirkpatrick são: reação, aprendizagem, comportamento (aplicação no trabalho) e resultados."},{"s":"Noções de Administração","t":"A Emenda Constitucional nº 19/1998, conhecida como Reforma Administrativa, incluiu no art. 37 da Constituição o princípio da:","o":["legalidade","eficiência","moralidade","impessoalidade","publicidade"],"c":1,"w":"A EC nº 19/1998 acrescentou a eficiência aos princípios da administração pública, refletindo o ideário gerencial."},{"s":"Noções de Arquivologia","t":"Quanto ao gênero, ofícios, memorandos, atas e relatórios em papel são documentos:","o":["cartográficos","filmográficos","iconográficos","textuais","sonoros"],"c":3,"w":"Documentos textuais são os manuscritos, datilografados ou impressos, cuja informação está em forma de texto."},{"s":"Legislação Relativa à PRF","t":"Segundo o art. 7º do CTB, a Polícia Rodoviária Federal:","o":["não integra o Sistema Nacional de Trânsito","é órgão do Poder Judiciário","compõe o Sistema Nacional de Trânsito","é o órgão máximo normativo do Sistema Nacional de Trânsito","substitui o CONTRAN nas rodovias federais"],"c":2,"w":"O art. 7º do CTB lista a PRF entre os órgãos e entidades que compõem o Sistema Nacional de Trânsito."}]],"pet":[[{"s":"Língua Portuguesa","t":"Leia:\n\"A manutenção preditiva não elimina a necessidade de intervenções, mas permite programá-las no momento mais oportuno, reduzindo paradas não planejadas.\"\nInfere-se do texto que a manutenção preditiva:","o":["contribui para planejar as intervenções e evitar paradas inesperadas.","aumenta o número de paradas não planejadas.","substitui completamente a manutenção corretiva emergencial em todos os casos.","torna desnecessária qualquer intervenção nos equipamentos.","é aplicada somente após a quebra do equipamento."],"c":0,"w":"O texto afirma que a preditiva 'não elimina' as intervenções, mas permite 'programá-las', reduzindo paradas não planejadas. As demais alternativas contradizem ou extrapolam o trecho."},{"s":"Língua Portuguesa","t":"Assinale a frase correta quanto à concordância nominal.","o":["Seguem anexas as notas fiscais e o certificado de calibração.","É proibido a entrada de pessoas sem crachá na sala de controle.","Segue anexo as notas fiscais e o certificado de calibração.","As operadoras disseram que elas mesmo fariam a medição.","Havia bastante equipamentos aguardando manutenção."],"c":0,"w":"'Anexo' é adjetivo e concorda com o substantivo: 'Seguem anexas as notas' (concordância com o mais próximo, no feminino plural). 'É proibida a entrada' — quando o substantivo vem determinado por artigo, o predicativo concorda. 'Elas mesmas' e 'bastantes equipamentos' (bastante como adjetivo = muitos) também variam."},{"s":"Língua Portuguesa","t":"Em qual das alternativas o verbo 'haver' foi empregado de forma INCORRETA quanto à concordância?","o":["Há anos o terminal não registra acidentes com afastamento.","Deve haver sobressalentes suficientes no almoxarifado.","Havia, no pátio, dezenas de tubos aguardando inspeção.","Os operadores haviam concluído a partida antes do fim do turno.","Houveram atrasos significativos na entrega dos equipamentos."],"c":4,"w":"No sentido de 'existir' ou 'ocorrer', 'haver' é impessoal e fica no singular: 'Houve atrasos'. Como auxiliar de tempo composto ('haviam concluído'), ele concorda normalmente com o sujeito. 'Há anos' indica tempo decorrido e também é impessoal."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o emprego de 'onde' está de acordo com a norma-padrão.","o":["A refinaria onde trabalho fica em São José dos Campos.","Houve uma época onde o petróleo era barato.","Foi uma reunião onde todos opinaram.","O relatório mostrou falhas, onde concluímos que o sensor estava descalibrado.","É uma situação onde não há saída fácil."],"c":0,"w":"'Onde' deve referir-se a lugar físico (a refinaria). Para reunião, época ou situação, usam-se 'em que' ou 'na qual'. Também não se usa 'onde' como conectivo conclusivo ('do que concluímos')."},{"s":"Matemática","t":"O preço do óleo diesel subiu de R$ 5,60 para R$ 6,16 por litro. O aumento foi de:","o":["56%","10%","9,1%","5,6%","11%"],"c":1,"w":"Aumento = 6,16 − 5,60 = 0,56. Percentual = 0,56 ÷ 5,60 = 0,10 = 10%."},{"s":"Matemática","t":"Em um mapa de instalações na escala 1:2.500, a distância entre dois tanques é de 8 cm. A distância real entre eles é:","o":["312,5 metros","20 metros","250 metros","2.000 metros","200 metros"],"c":4,"w":"Na escala 1:2.500, cada 1 cm no mapa corresponde a 2.500 cm reais. 8 × 2.500 = 20.000 cm = 200 m."},{"s":"Matemática","t":"Se 3 kg de eletrodo são suficientes para 45 metros de solda, quantos quilos são necessários para 120 metros?","o":["7,5 kg","8 kg","9 kg","6 kg","12 kg"],"c":1,"w":"Consumo de 3 ÷ 45 = 1/15 kg por metro. Para 120 m: 120 ÷ 15 = 8 kg."},{"s":"Conhecimentos Específicos","t":"Um trocador de calor tem a temperatura do fluido quente caindo de 150 °C para 90 °C e a do fluido frio subindo de 30 °C para 70 °C, em contracorrente. As diferenças de temperatura nas extremidades são:","o":["60 °C e 40 °C","80 °C e 60 °C","90 °C e 70 °C","150 °C e 30 °C","120 °C e 20 °C"],"c":1,"w":"Em contracorrente, a entrada do quente encontra a saída do frio: 150 − 70 = 80 °C. Na outra ponta, a saída do quente encontra a entrada do frio: 90 − 30 = 60 °C. A MLDT = (80 − 60)/ln(80/60) ≈ 69,5 °C."},{"s":"Conhecimentos Específicos","t":"A unidade de recuperação de enxofre (URE), que utiliza o processo Claus, converte:","o":["CO₂ em carbonato de cálcio.","mercaptanas em gasolina.","enxofre em ácido sulfúrico concentrado.","H₂S em enxofre elementar.","SO₂ em H₂S."],"c":3,"w":"No processo Claus, parte do H₂S é queimada formando SO₂, que reage com o H₂S restante em reatores catalíticos, produzindo enxofre elementar líquido e água."},{"s":"Conhecimentos Específicos","t":"O GLP (gás liquefeito de petróleo) é composto principalmente por:","o":["metano e etano.","hidrogênio e monóxido de carbono.","propano e butano.","benzeno e tolueno.","pentano e hexano."],"c":2,"w":"O GLP é uma mistura de hidrocarbonetos de 3 e 4 carbonos (propano e butano), que se liquefazem sob pressão moderada à temperatura ambiente. O metano é o principal componente do gás natural."}],[{"s":"Língua Portuguesa","t":"Considere: \"Ela ficou ______ preocupada com os resultados, e as amostras chegaram ______.\" As expressões que preenchem corretamente as lacunas são:","o":["meio — meio contaminadas","meia — meio contaminadas","meia — meias contaminadas","meio — meias contaminadas","meios — meios contaminadas"],"c":0,"w":"'Meio', quando significa 'um pouco' e modifica adjetivo, é advérbio e não varia: 'meio preocupada', 'meio contaminadas'. Ele só concorda quando é numeral (= metade): 'meia hora', 'meias garrafas'."},{"s":"Língua Portuguesa","t":"\"À medida que a temperatura aumenta, a viscosidade do óleo diminui.\" A locução 'À medida que' estabelece relação de:","o":["causa.","proporção.","concessão.","tempo pontual.","finalidade."],"c":1,"w":"'À medida que' e 'à proporção que' indicam proporção: uma grandeza varia conforme outra varia. Não se confunde com 'na medida em que', que tem valor causal."},{"s":"Língua Portuguesa","t":"\"O supervisor pediu os relatórios e o técnico entregou ______ ontem; quanto às chaves, ele ______ guardou no armário.\" As lacunas ficam corretas com:","o":["-lhes — lhes","eles — elas","-os — as","-los — lhe","-lo — a"],"c":2,"w":"'Entregar' tem objeto direto ('os relatórios'), substituído por 'os': 'entregou-os'. Na segunda oração, o pronome pessoal 'ele' (sujeito) não é palavra atrativa obrigatória, mas a próclise é comum e aceita: 'ele as guardou'. 'Lhe' substitui objeto indireto e não cabe aqui."},{"s":"Língua Portuguesa","t":"Na frase \"Os técnicos chegaram cansados após o turno\", o termo 'cansados' é:","o":["adjunto adnominal.","adjunto adverbial de modo.","predicativo do objeto.","objeto direto.","predicativo do sujeito."],"c":4,"w":"'Cansados' atribui um estado ao sujeito 'Os técnicos' por meio de um verbo intransitivo ('chegaram'), formando predicado verbo-nominal. É predicativo do sujeito e concorda com ele."},{"s":"Matemática","t":"A densidade de um óleo é 0,85 kg/L. A massa de 2.400 litros desse óleo é:","o":["2.823,5 kg","204 kg","2.400 kg","2.040 kg","1.850 kg"],"c":3,"w":"Massa = densidade × volume = 0,85 kg/L × 2.400 L = 2.040 kg."},{"s":"Matemática","t":"Um tanque cilíndrico de 4 m de raio contém óleo até a altura de 5 m. Sabendo que 1 m³ = 1.000 L, o volume de óleo é aproximadamente (use π = 3,14):","o":["251.200 litros","251,2 litros","125.600 litros","2.512.000 litros","62.800 litros"],"c":0,"w":"V = 3,14 × 4² × 5 = 251,2 m³. Convertendo: 251,2 × 1.000 = 251.200 litros."},{"s":"Matemática","t":"Seis técnicos executam a pintura de um tanque em 10 dias. Com o mesmo ritmo de trabalho, quantos dias 4 técnicos levariam para executar o mesmo serviço?","o":["14 dias","15 dias","12 dias","6,7 dias","20 dias"],"c":1,"w":"Número de técnicos e tempo são inversamente proporcionais. O serviço equivale a 6 × 10 = 60 técnico-dias; com 4 técnicos, 60 ÷ 4 = 15 dias."},{"s":"Conhecimentos Específicos","t":"Em um medidor por placa de orifício, a pressão diferencial passou de 100 mbar para 25 mbar. Mantidas as demais condições, a vazão:","o":["dobrou.","caiu para a metade.","não se alterou.","caiu para um quarto.","caiu para um oitavo."],"c":1,"w":"Q ∝ √ΔP: √(25/100) = √0,25 = 0,5. A vazão caiu para 50% do valor anterior."},{"s":"Conhecimentos Específicos","t":"O principal mecanismo de transferência de calor da chama para os tubos na zona de radiação de um forno é:","o":["a condução pelo ar.","a convecção natural da carga.","a condução pelos suportes.","a evaporação.","a radiação."],"c":4,"w":"Na câmara de combustão, a chama e os gases a altíssima temperatura transmitem calor principalmente por radiação. Na zona de convecção, os gases mais frios transferem calor sobretudo por convecção."},{"s":"Conhecimentos Específicos","t":"A viscosidade de um óleo lubrificante, ao aumentar sua temperatura:","o":["aumenta.","aumenta e depois se anula.","não se altera.","torna-se igual à da água em qualquer caso.","diminui."],"c":4,"w":"Em líquidos, a viscosidade diminui com o aumento da temperatura. O índice de viscosidade (IV) mede quanto o óleo varia: óleos com IV alto variam menos."}],[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o verbo 'visar' está empregado segundo a norma-padrão.","o":["O novo procedimento visa à redução de emissões fugitivas.","O novo procedimento visa a redução de emissões fugitivas, e o fiscal visou ao passaporte.","O inspetor visou ao documento antes de liberá-lo.","O projeto visa na melhoria da confiabilidade.","O atirador visou no alvo durante o treinamento."],"c":0,"w":"'Visar' no sentido de 'ter como objetivo' é transitivo indireto e rege 'a' ('visa à redução'). No sentido de 'pôr visto' ou 'mirar', é transitivo direto ('visou o documento', 'visou o alvo')."},{"s":"Língua Portuguesa","t":"Na oração \"Foram encontradas trincas na solda do vaso\", o sujeito é:","o":["inexistente.","a solda do vaso.","trincas.","indeterminado.","oculto (eles)."],"c":2,"w":"A oração está na voz passiva analítica (foram encontradas). Quem 'foi encontrado' foram as trincas — esse é o sujeito paciente, que fica posposto ao verbo."},{"s":"Língua Portuguesa","t":"Em \"Já te falei mil vezes para usar o protetor auricular\", a expressão destacada 'mil vezes' constitui:","o":["antítese.","prosopopeia.","catacrese.","hipérbole.","metonímia."],"c":3,"w":"A hipérbole é um exagero intencional para dar ênfase. 'Mil vezes' não indica quantidade real, mas reforça a repetição do aviso."},{"s":"Matemática","t":"Uma bomba transfere 1.800 litros de diesel em 12 minutos. Mantida a mesma vazão, o tempo necessário para transferir 4.500 litros é:","o":["36 minutos","30 minutos","24 minutos","27 minutos","4,8 minutos"],"c":1,"w":"Volume e tempo são diretamente proporcionais (vazão constante). A vazão é 1.800 ÷ 12 = 150 L/min, e o tempo é 4.500 ÷ 150 = 30 minutos."},{"s":"Matemática","t":"Um relógio de turno marca 23h40. Após 7 horas e 35 minutos, o relógio marcará:","o":["6h15","7h15","31h15","6h75","7h05"],"c":1,"w":"23h40 + 7h = 6h40. 6h40 + 35 min = 7h15 (40 + 35 = 75 min = 1h15)."},{"s":"Matemática","t":"O preço de um lote de válvulas era R$ 8.000,00. Ele sofreu um aumento de 25% e, em seguida, um desconto de 20%. O preço final do lote é:","o":["R$ 8.400,00","R$ 8.200,00","R$ 10.000,00","R$ 8.000,00","R$ 7.800,00"],"c":3,"w":"Aumentos e descontos sucessivos se multiplicam: 8.000 × 1,25 = 10.000; 10.000 × 0,80 = 8.000. O fator total é 1,25 × 0,80 = 1, e por isso o preço volta ao original. Somar diretamente +25% − 20% = +5% é um erro comum."},{"s":"Conhecimentos Específicos","t":"A válvula globo é mais adequada que a válvula gaveta para:","o":["passagem de pigs.","bloqueio com mínima perda de carga.","regulagem (estrangulamento) de vazão.","impedir o fluxo reverso.","linhas de grande diâmetro com fluido abrasivo."],"c":2,"w":"A geometria da válvula globo permite controle de vazão em posições intermediárias, com boa vedação, mas com perda de carga maior que a da gaveta."},{"s":"Conhecimentos Específicos","t":"O aço inoxidável tem condutividade térmica menor que a do cobre. Portanto, para a mesma espessura e mesma diferença de temperatura, uma parede de inox conduz:","o":["calor somente se houver convecção interna.","a mesma quantidade de calor que uma de cobre.","calor apenas por radiação.","menos calor que uma parede de cobre.","mais calor que uma parede de cobre."],"c":3,"w":"Pela lei de Fourier, q = k · A · ΔT / L. Com área, espessura e ΔT iguais, o fluxo é proporcional à condutividade k. O cobre conduz muito mais que o inox."},{"s":"Conhecimentos Específicos","t":"A potência dissipada por um aquecedor que consome 10 A ligado em 220 V (carga resistiva) é:","o":["230 W","2.200 W","210 W","22.000 W","22 W"],"c":1,"w":"Para carga resistiva, P = V × I = 220 × 10 = 2.200 W."},{"s":"Conhecimentos Específicos","t":"Em um desenho técnico na escala 1:5, uma peça representada com 40 mm tem dimensão real de:","o":["8 mm","40 mm","200 mm","45 mm","2.000 mm"],"c":2,"w":"Na escala de redução 1:5, cada 1 mm do desenho corresponde a 5 mm reais: 40 × 5 = 200 mm."}]],"pc":[[{"s":"Língua Portuguesa","t":"Assinale a alternativa que apresenta um período composto por coordenação sindética adversativa.","o":["O suspeito tentou fugir, mas foi detido pelos policiais.","O investigador analisou as provas e concluiu o inquérito.","Ou o meliante se entrega, ou a polícia invadirá o local.","O perito examinou o local, portanto o laudo será emitido logo.","Estude muito, porque o concurso da Polícia Civil é concorrido."],"c":0,"w":"A conjunção 'mas' liga orações coordenadas exprimindo oposição (adversativa)."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a palavra destacada tem valor restritivo.","o":["O perito criminal, **que** é especialista em balística, analisou a arma.","O policial civil, **cujo** distintivo foi furtado, registrou boletim.","Os suspeitos, **que** fugiram em um carro preto, foram capturados.","O delegado, **que** coordenou a operação, foi elogiado.","Os investigadores **que** participaram da operação receberam medalha."],"c":4,"w":"A oração sem vírgulas ('que participaram da operação') restringe o universo dos investigadores aos que participaram da ação específica. As demais são explicativas (isoladas por vírgulas)."},{"s":"Direito Penal","t":"O funcionário público que retarda ou deixa de praticar ato de ofício, indevidamente, para satisfazer interesse ou sentimento pessoal, comete o crime de:","o":["Concussão.","Corrupção passiva.","Condescendência criminosa.","Advocacia administrativa.","Prevaricação."],"c":4,"w":"Prevaricação (art. 319 do CP): retardar ou omitir ato de ofício, ou praticá-lo contra expressa disposição de lei, para satisfazer interesse ou sentimento pessoal."},{"s":"Direito Penal","t":"Subtrair coisa alheia móvel, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência, caracteriza o crime de:","o":["Furto qualificado.","Extorsão.","Roubo.","Apropriação indébita.","Estelionato."],"c":2,"w":"Definição legal do crime de Roubo (art. 157 do CP)."},{"s":"Direito Processual Penal","t":"O inquérito policial, procedimento administrativo inquisitório conduzido pela Polícia Judiciária, tem como uma de suas características principais:","o":["Garantir o contraditório e a ampla defesa em sua plenitude durante todas as oitivas.","Ser imprescritível e indispensável para a propositura de qualquer ação penal.","Ser sigiloso, inquisitivo, dispensável, escrito e oficial.","Ser da competência exclusiva dos juízes de direito das varas criminais.","Exigir a presença obrigatória de defensor constituído para o indiciado em todos os atos."],"c":2,"w":"O inquérito policial é inquisitivo (não há contraditório amplo), dispensável (se a denúncia já tiver base em outras provas), escrito, sigiloso e oficial."},{"s":"Direito Processual Penal","t":"O flagrante preparado (delito putativo por obra do agente provocador), consagrado na jurisprudência pátria (Súmula 145 do STF):","o":["Torna o crime perfeitamente válido e enseja condenação severa.","É lícito quando autorizado pelo delegado de polícia.","Valida a prisão em flagrante se houver consentimento da vítima.","Aplica-se apenas aos crimes hediondos.","É considerado crime impossível, tornando a conduta atípica."],"c":4,"w":"Súmula 145 do STF: 'Não há crime quando a preparação do flagrante pela polícia torna impossível a sua consumação.' (Crime impossível)."},{"s":"Direito Constitucional","t":"O mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional, organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos:","o":["6 meses.","2 anos.","5 anos.","3 anos.","1 ano."],"c":4,"w":"Requisito temporal para impetração de mandado de segurança coletivo por associação: em funcionamento há pelo menos 1 ano (art. 5°, LXX, b, da CF)."},{"s":"Direito Constitucional","t":"A competência para legislar privativamente sobre direito penal, processual penal, civil e eleitoral é:","o":["Exclusiva dos Municípios.","Concorrente entre Estados e União.","Privativa da União.","Comum entre União, Estados e Distrito Federal.","Facultativa aos Estados-membros."],"c":2,"w":"Art. 22, I, da CF: Compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho."},{"s":"Direito Administrativo","t":"O ato administrativo que apresenta vício insanável no objeto (por ser impossível ou ilícito) ou na finalidade (desvio de poder) é considerado:","o":["Perfeitamente válido e sanável por ratificação.","Anulável, produzindo efeitos até que o juiz o declare inválido.","Inexistente sem repercussão jurídica.","Nulo, não podendo ser convalidado.","Meramente irregular."],"c":3,"w":"O ato com vício insanável no objeto, motivo ou finalidade é nulo e não admite convalidação (ao contrário de incompetência em razão do lugar e vício de forma, que podem ser convalidados se não forem essenciais)."},{"s":"Noções de Informática","t":"Sobre computação em nuvem (Cloud Computing), o modelo de serviço em que a infraestrutura completa (servidores, redes, armazenamento) é alugada e disponibilizada para que o usuário instale sistemas operacionais e aplicações próprias denomina-se:","o":["SaaS (Software as a Service).","IaaS (Infrastructure as a Service).","PaaS (Platform as a Service).","DaaS (Desktop as a Service estrito).","NaaS (Network as a Service isolado)."],"c":1,"w":"IaaS (Infraestrutura como Serviço) fornece recursos computacionais básicos de infraestrutura (máquinas virtuais, armazenamento, redes)."}],[{"s":"Língua Portuguesa","t":"Assinale a alternativa correta quanto à colocação pronominal (norma-padrão).","o":["Me empreste sua arma de fogo, colega.","Nunca disseram-me a verdade sobre o álibi.","O suspeito evadiu-se assim que viu a viatura.","Me contaram que houve um assalto a banco.","Se recusaram a prestar depoimento sem advogado."],"c":2,"w":"Não se inicia frase com pronome oblíquo átono, por isso A, D e E estão erradas. Em B, o advérbio 'nunca' atrai o pronome: 'Nunca me disseram'. Em C, a ênclise 'evadiu-se' está correta."},{"s":"Língua Portuguesa","t":"Indique a alternativa que apresenta a pontuação correta para a frase:","o":["O delegado, convocou a equipe, para esclarecer o caso.","O delegado convocou, a equipe para esclarecer o caso.","O delegado convocou a equipe, para esclarecer o caso.","O delegado convocou a equipe para, esclarecer o caso.","O delegado convocou a equipe para esclarecer o caso."],"c":4,"w":"Não se separa o sujeito do predicado, nem o verbo de seus complementos diretos com vírgula. A estrutura direta (Sujeito + Verbo + Objeto + Adjunto adverbial) não exige pontuação."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a regência do verbo 'aspirar' está empregada em conformidade com a norma-padrão da língua escrita, no sentido de almejar, desejar.","o":["O policial civil aspirava ao cargo de delegado com muita dedicação.","Todos aspiravam o distintivo brilhante da corporação.","O investigador aspirava para a promoção de classe.","A equipe policial aspirava contra a corrupção na cidade.","Os agentes aspiravam o ar puro da serra durante a diligência."],"c":0,"w":"No sentido de almejar/desejar, o verbo 'aspirar' é transitivo indireto e exige a preposição 'a' (aspirar a algo)."},{"s":"Língua Portuguesa","t":"Assinale a alternativa que apresenta uma figura de linguagem de comparação implícita (metáfora).","o":["O delegado é como uma águia na investigação.","O policial agiu corajosamente no confronto.","O réu chorou rios de lágrimas na audiência.","Aquele inspetor é uma verdadeira raposa astuta.","A sirene da viatura gemia na madrugada."],"c":3,"w":"'Aquele inspetor é uma raposa' atribui uma característica de forma direta (metáfora). A opção A usa 'como' (comparação explícita/símile)."},{"s":"Direito Penal","t":"Matar alguém sob o domínio de violenta emoção, logo após injusta provocação da vítima, configura o crime de:","o":["Homicídio culposo.","Homicídio qualificado por motivo fútil.","Legítima defesa putativa.","Homicídio privilegiado.","Excesso extensivo."],"c":3,"w":"Trata-se do homicídio privilegiado (causa de diminuição de pena prevista no art. 121, § 1°, do CP)."},{"s":"Direito Penal","t":"O funcionário público que exige, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, comete o crime de:","o":["Corrupção passiva.","Concussão.","Corrupção ativa.","Prevaricação.","Excesso de exação."],"c":1,"w":"O verbo 'exigir' caracteriza o crime de Concussão (art. 316 do CP). Corrupção passiva é 'solicitar ou receber'."},{"s":"Direito Constitucional","t":"O direito de resposta proporcional ao agravo, além da indenização por dano material, moral ou à imagem, é assegurado pela Constituição Federal a:","o":["Apenas agentes políticos em exercício.","Exclusivamente órgãos de imprensa cadastrados.","Pessoas físicas detentoras de mandato eletivo.","Servidores públicos civis perseguidos disciplinarmente.","Qualquer cidadão ou pessoa jurídica ofendida."],"c":4,"w":"Art. 5°, V, da CF: é assegurado o direito de resposta, proporcional ao agravo, além da indenização por dano material, moral ou à imagem."},{"s":"Direito Administrativo","t":"O princípio da Administração Pública que proíbe a promoção pessoal de autoridades ou servidores públicos em propagandas, nomes, símbolos ou imagens de obras públicas é o da:","o":["Impessoalidade.","Legalidade.","Eficiência.","Continuidade do serviço público.","Autotutela."],"c":0,"w":"O princípio da impessoalidade veda a promoção pessoal de agentes públicos com recursos e obras da administração pública (art. 37, § 1°, da CF)."},{"s":"Direito Administrativo","t":"Os requisitos (ou elementos) de validade do ato administrativo são:","o":["Autorização, conveniência, oportunidade, legalidade e publicidade.","Sujeito ativo, sujeito passivo, causa, efeito e sanção.","Vontade, capacidade, licitude, forma escrita e registro.","Competência, hierarquia, subordinação, conveniência e custo.","Competência, finalidade, forma, motivo e objeto."],"c":4,"w":"Os 5 requisitos/elementos do ato administrativo (comprovados na mnemônica COM-FI-FO-MO-OB): Competência, Finalidade, Forma, Motivo e Objeto."},{"s":"Noções de Informática","t":"Na internet, o protocolo seguro utilizado para transferência hipertexto criptografada entre o navegador e o servidor web é o:","o":["HTTP","FTP","SSH","Telnet","HTTPS"],"c":4,"w":"HTTPS (HyperText Transfer Protocol Secure) utiliza criptografia SSL/TLS para conexões seguras na web (porta padrão 443)."}],[{"s":"Língua Portuguesa","t":"Dentre as opções abaixo, assinale aquela em que todas as palavras são acentuadas pela mesma regra de acentuação gráfica (oxítonas).","o":["Polícia, fósforo, caqui","Índio, sótão, álbum","Café, parabéns, cajá","Vintém, caráter, jacaré","Açaí, armazém, hífen"],"c":2,"w":"Café, parabéns e cajá são todas palavras oxítonas terminadas em 'e', 'em' e 'a', acentuadas pelas regras das oxítonas."},{"s":"Língua Portuguesa","t":"Assinale a opção em que o vocábulo destacado exerce a função de agente da passiva.","o":["O criminoso feriu **o policial** com uma faca.","O perito entregou **o laudo** ao juiz.","A viatura colidiu **com o poste** na avenida.","O inquérito foi concluído **pelo delegado** titular.","O plantão policial permaneceu **tranquilo** durante a noite."],"c":3,"w":"'pelo delegado' é o agente da ação na voz passiva analítica ('foi concluído')."},{"s":"Língua Portuguesa","t":"No trecho 'O delegado analisou o documento **que** foi entregue pelo escrivão', a palavra destacada classifica-se morfologicamente como:","o":["Conjunção integrante.","Conjunção subordinativa causal.","Preposição essencial.","Pronome relativo.","Pronome demonstrativo."],"c":3,"w":"O 'que' substitui 'o documento' e introduz uma oração subordinada adjetiva, funcionando como pronome relativo."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o pronome relativo está empregado incorretamente quanto ao regime ou forma.","o":["Este é o delegado a cujo gabinete comparecemos.","O distrito policial em que trabalho é movimentado.","O inquérito a que me refiro foi arquivado.","A arma com que o crime foi cometido foi apreendida.","A testemunha que falei com ela está protegida."],"c":4,"w":"O verbo 'falar' rege a preposição 'com' (com quem falei). O pronome relativo correto seria 'com quem' ou 'de quem', nunca 'que... com ela'."},{"s":"Direito Penal","t":"Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento, configura:","o":["Furto mediante fraude.","Estelionato.","Extorsão indireta.","Apropriação indébita previdenciária.","Receptação qualificada."],"c":1,"w":"Definição legal do crime de Estelionato (art. 171 do CP). A fraude engana a vítima, fazendo com que ela entregue o bem voluntariamente (diferente do furto mediante fraude, em que a fraude serve para burlar a vigilância para subtrair)."},{"s":"Direito Constitucional","t":"A Ação Popular pode ser proposta por qualquer cidadão para anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural. Para os fins da ação, cidadão é:","o":["Qualquer pessoa residente no território nacional, com ou sem CPF.","Apenas advogado inscrito na OAB.","O indivíduo no gozo dos seus direitos políticos (eleitor).","Estrangeiro com visto permanente.","Pessoa jurídica sem fins lucrativos."],"c":2,"w":"Cidadão, para fins de Ação Popular (art. 5°, LXXIII, da CF), é o indivíduo que está no gozo de seus direitos políticos (possui título de eleitor)."},{"s":"Direito Administrativo","t":"Os princípios expressos fundamentais da Administração Pública na Constituição Federal (art. 37, caput) são mnemônica e legalmente conhecidos pelo acrônimo LIMPE:","o":["Liberdade, Igualdade, Modernidade, Probidade e Eficiência.","Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.","Legalidade, Imparcialidade, Meritocracia, Publicidade e Economicidade.","Legitimidade, Impessoalidade, Moralidade, Presteza e Eficácia.","Legalidade, Interesses públicos, Moralidade, Prudência e Eficiência."],"c":1,"w":"LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência (art. 37, caput, da CF)."},{"s":"Direito Administrativo","t":"A investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão declarado em lei de:","o":["Provimento efetivo técnico.","Estabilidade imediata.","Livre nomeação e exoneração.","Carreira policial civil exclusiva.","Magistratura superior."],"c":2,"w":"Art. 37, II, da CF: Os cargos em comissão destinam-se apenas às atribuições de direção, chefia e assessoramento, sendo de livre nomeação e exoneração."},{"s":"Noções de Informática","t":"No ambiente Windows (como o Windows 10/11), o atalho de teclado composto pelas teclas **Ctrl + Shift + Esc** tem a função direta de abrir o:","o":["Explorador de Arquivos.","Gerenciador de Tarefas.","Painel de Controle.","Bloco de Notas em modo administrador.","Prompt de Comando."],"c":1,"w":"Ctrl + Shift + Esc abre diretamente o Gerenciador de Tarefas do Windows."},{"s":"Direito Processual Penal","t":"O inquérito policial deverá terminar no prazo de __ dias, se o indiciado tiver sido preso em flagrante ou estiver preso preventivamente, contado o prazo desde o dia em que se executou a ordem de prisão, nos crimes comuns.","o":["15","10","30","40","60"],"c":1,"w":"Prazo para conclusão do inquérito policial com indiciado preso é de 10 dias (art. 10 do CPP) nos crimes da competência da justiça comum (em federais pode variar, mas a regra geral do CPP é 10 dias preso e 30 solto)."}]]};          // DADOS[concurso] = [rodada1, rodada2, rodada3], 10 questões fixas em cada
  var CONC = [
    ['cmrb', '🏛️', 'Câmara de Rio Branco', 'Edital IDIB · prova em 22/11', 'mais procurado'],
    ['prf', '🚓', 'PRF – Policial', 'Trânsito, Direito e Física'],
    ['adm', '🗂️', 'PRF – Agente Administrativo', 'Formato FUNCAB'],
    ['pet', '🛢️', 'Petrobras', 'Português, Matemática e Específicos'],
    ['pc', '🕵️', 'Polícia Civil', 'Penal, Processo Penal e Constitucional']
  ];
  var INSTA = 'simulado.aprova';
  var SITE = location.origin && location.origin.indexOf('http') === 0 ? location.origin : 'https://simulado-concursos-3y2j.onrender.com';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { var d = document.createElement('div'); d.textContent = String(t == null ? '' : t); return d.innerHTML.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
  var params = new URLSearchParams(location.search);
  var L = 'ABCDE';
  var app = $('app');
  var st = null, iniciou = false, liberadas = 0, timer = null;

  // ---------- memória deste aparelho (se o navegador bloquear, funciona só nesta visita) ----------
  var mem = {};
  function ler(k) { try { var v = localStorage.getItem('sg_' + k); return v === null ? mem[k] : v; } catch (e) { return mem[k]; } }
  function gravar(k, v) { mem[k] = String(v); try { localStorage.setItem('sg_' + k, String(v)); } catch (e) {} }
  var eu = ler('eu');
  if (!/^[a-z0-9]{10}$/.test(eu || '')) { eu = ''; var ab = 'abcdefghijkmnpqrstuvwxyz23456789'; for (var i = 0; i < 10; i++) eu += ab[Math.floor(Math.random() * ab.length)]; gravar('eu', eu); }
  liberadas = Math.min(2, +ler('lib') || 0);
  function feitas(k) { return Math.min(3, +ler('feitas_' + k) || 0); }

  function nomeDe(k) { for (var i = 0; i < CONC.length; i++) if (CONC[i][0] === k) return CONC[i][2]; return ''; }
  function ev(nome, dados) { try { if (window.fbq) fbq('trackCustom', nome, dados || {}); } catch (e) {} }
  function topo() { var y = app.getBoundingClientRect().top + window.scrollY - 12; if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'smooth' }); }
  function meuLink(k) { return SITE + '/gratis?c=' + (k || 'cmrb') + '&r=' + eu + '&utm_source=instagram&utm_medium=indicacao&utm_campaign=gratis'; }

  // ---------- indicação: quem chegou pelo link de alguém conta como visita para essa pessoa ----------
  var ref = params.get('r');
  if (ref && /^[a-z0-9]{10}$/.test(ref) && ref !== eu && !ler('v_' + ref)) {
    fetch('/api/gratis/visita', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: ref }) })
      .then(function (r) { if (r.ok) gravar('v_' + ref, 1); }).catch(function () {});
  }
  function verificar(cb) {
    fetch('/api/gratis/indicacoes?ref=' + eu, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && typeof d.liberadas === 'number' && d.liberadas > liberadas) { liberadas = d.liberadas; gravar('lib', liberadas); ev('GratisLiberou', { total: liberadas }); }
        cb && cb(!!d);
      }).catch(function () { cb && cb(false); });
  }

  // ---------- telas ----------
  function escolha() {
    st = null; parar(); document.body.classList.remove('emquiz');
    app.innerHTML = '<h2 class="h3">Qual é o seu concurso?</h2><p class="muted" style="margin-top:4px">São 10 questões no estilo da banca, todas com explicação.</p>' +
      '<div class="lista">' + CONC.map(function (c) {
        var f = feitas(c[0]);
        var tag = f ? '<span class="dest" style="background:#E3E7F0;color:#334155">' + (f * 10) + '/30</span>' : (c[4] ? '<span class="dest">' + c[4] + '</span>' : '');
        return '<button type="button" class="conc" data-k="' + c[0] + '"><span class="e">' + c[1] + '</span><span><b>' + c[2] + '</b><small>' + c[3] + '</small></span>' + tag + '</button>';
      }).join('') + '</div>' +
      '<div class="selos"><span>Sem cadastro</span><span>Sem pagar nada</span><span>Gabarito comentado</span></div>';
    app.querySelectorAll('.conc').forEach(function (b) { b.onclick = function () { abrir(b.dataset.k); }; });
  }

  // Decide o que mostrar para o concurso: próxima rodada liberada, tela para liberar ou fim
  function abrir(k) {
    document.body.classList.add('emquiz');
    var f = feitas(k);
    if (f >= 3) return fim(k);
    if (f === 0 || liberadas >= f) return comecar(k, f);
    telaLiberar(k, f, null);
  }

  function comecar(k, rod) {
    parar();
    st = { k: k, rod: rod, q: DADOS[k][rod], step: 0, picked: null, score: 0, hist: [] };
    ev('GratisRodada', { concurso: k, rodada: rod + 1 });
    quiz(); topo();
  }

  function quiz() {
    var q = st.q[st.step], ans = st.picked !== null, n = st.q.length;
    var h = '<div class="qtop"><span class="qsub">' + esc(q.s) + '</span><span>' + (st.rod ? 'Rodada ' + (st.rod + 1) + ' · ' : '') + (st.step + 1) + ' de ' + n + '</span></div>' +
      '<div class="bar"><div style="width:' + ((st.step + (ans ? 1 : 0)) / n * 100) + '%"></div></div>' +
      '<p class="qtext">' + esc(q.t) + '</p><div class="opts">';
    q.o.forEach(function (o, i) {
      var cls = 'opt', mk = '';
      if (ans) { if (i === q.c) { cls += ' ok'; mk = '✓'; } else if (i === st.picked) { cls += ' bad'; mk = '✕'; } else cls += ' off'; }
      h += '<button type="button" class="' + cls + '" data-i="' + i + '"' + (ans ? ' disabled' : '') + '><b>' + L[i] + ')</b><span>' + esc(o) + '</span><i>' + mk + '</i></button>';
    });
    h += '</div>';
    if (ans) h += '<div class="why"><strong>' + (st.picked === q.c ? 'Correto!' : 'Resposta: ' + L[q.c] + '.') + '</strong> ' + esc(q.w) + '</div>';
    h += '<button type="button" class="btn azul" id="prox"' + (ans ? '' : ' disabled') + '>' + (st.step < n - 1 ? 'Próxima questão' : 'Ver meu resultado') + '</button>';
    if (st.step === 0 && !ans && st.rod === 0) h += '<button type="button" class="linkbtn" id="trocar">Trocar de concurso</button>';
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        if (st.picked !== null) return;
        var i = +b.dataset.i; st.picked = i; var ok = i === st.q[st.step].c; if (ok) st.score++; st.hist.push(ok);
        if (!iniciou) { iniciou = true; ev('GratisIniciado', { concurso: st.k }); }
        quiz();
      };
    });
    $('prox').onclick = function () { if (st.step < n - 1) { st.step++; st.picked = null; quiz(); topo(); } else resultado(); };
    if ($('trocar')) $('trocar').onclick = escolha;
  }

  function blocoCompleto(k) {
    var camara = k === 'cmrb';
    var conheca = '/conheca?' + new URLSearchParams({ modo: camara ? 'camara' : 'geral', utm_source: params.get('utm_source') || 'instagram', utm_medium: params.get('utm_medium') || 'dm', utm_campaign: 'gratis', utm_content: k }).toString();
    return '<div class="box"><div class="h3">Quer treinar com a prova inteira?</div>' +
      '<p>' + (camara ? '1.212 questões da Câmara de Rio Branco no formato do edital IDIB, com nota pelos pesos e o critério de aprovação.' : '3.263 questões de 5 concursos, no formato do edital, com cronômetro e relatório por matéria.') + ' Pagamento único, acesso vitalício.</p>' +
      '<a class="btn amar" id="completo" href="' + conheca + '">Conhecer o simulado completo</a></div>';
  }
  function blocoSeguir() {
    return '<a class="btn ig" id="seguir" href="https://www.instagram.com/' + INSTA + '/" target="_blank" rel="noopener">Seguir @' + INSTA + '</a>' +
      '<p class="muted" style="margin-top:8px;font-size:13px">Questões novas toda semana no perfil</p>';
  }
  // Caixa "envie para um amigo e ganhe +10"
  function blocoLiberar(k, rod) {
    if (liberadas >= rod) return '<div class="libera ok"><div class="h3">Rodada ' + (rod + 1) + ' liberada! 🎉</div><p>Mais 10 questões novas de ' + esc(nomeDe(k)) + ' esperando por você.</p>' +
      '<button type="button" class="btn amar" id="proxRod">Fazer as próximas 10 questões</button></div>';
    return '<div class="libera"><div class="h3">Ganhe mais 10 questões grátis 🎁</div>' +
      '<p>Envie seu link para um amigo pelo Direct do Instagram. <b>Assim que ele abrir o link</b>, a rodada ' + (rod + 1) + ' libera aqui. Vale para até 2 amigos (30 questões no total).</p>' +
      '<button type="button" class="btn ig" id="enviar">Enviar para um amigo</button>' +
      '<button type="button" class="btn cl" id="copiar">Copiar meu link</button>' +
      '<p class="aguarda" id="aguarda">Depois de enviar, deixe esta página aberta: ela confere sozinha quando seu amigo abrir.</p>' +
      '<button type="button" class="linkbtn" id="checar">Meu amigo já abriu, verificar agora</button></div>';
  }
  function ligarLiberar(k, rod, redesenhar) {
    if ($('proxRod')) { $('proxRod').onclick = function () { comecar(k, rod); }; return; }
    var link = meuLink(k), txt = 'Tô fazendo um simulado grátis de ' + nomeDe(k) + ', com gabarito comentado. Faz aí e vê quantas você acerta:';
    $('enviar').onclick = function () {
      ev('GratisLinkEnviado', { concurso: k, rodada: rod + 1 });
      if (navigator.share) navigator.share({ title: 'Simulado grátis', text: txt, url: link }).catch(function () {});
      else copiar(link, 'Link copiado! Agora cole no Direct do Instagram do seu amigo.');
      esperar(k, rod, redesenhar);
    };
    $('copiar').onclick = function () { copiar(txt + ' ' + link, 'Link copiado! Cole no Direct do Instagram do seu amigo.'); ev('GratisLinkCopiado', { concurso: k }); esperar(k, rod, redesenhar); };
    $('checar').onclick = function () {
      var a = $('aguarda'); a.textContent = 'Verificando...';
      verificar(function (ok) {
        if (liberadas >= rod) return redesenhar();
        a.textContent = ok ? 'Ainda não. Seu amigo precisa abrir o link no celular dele (não vale abrir no seu).' : 'Não consegui verificar agora. Tente de novo em instantes.';
      });
    };
  }
  function copiar(t, aviso) {
    var ok = function () { var a = $('aguarda'); if (a) a.textContent = aviso; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () { prompt('Copie o link:', t); });
    else prompt('Copie o link:', t);
  }
  // Confere sozinha a cada 5 s por até 10 min enquanto a página está aberta
  function esperar(k, rod, redesenhar) {
    parar(); var fim = Date.now() + 10 * 60 * 1000;
    timer = setInterval(function () {
      if (Date.now() > fim) return parar();
      if (document.hidden) return;
      verificar(function () { if (liberadas >= rod) { parar(); redesenhar(); } });
    }, 5000);
  }
  function parar() { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && timer) verificar(function () {}); });

  function resultado() {
    var n = st.q.length, s = st.score, C = 2 * Math.PI * 56, k = st.k, rod = st.rod;
    if (feitas(k) < rod + 1) gravar('feitas_' + k, rod + 1);
    var cor = s >= 8 ? '#15803D' : s >= 6 ? '#1E6FD9' : '#C2410C';
    var msg = s >= 8 ? ['Mandou muito bem!', 'Você está no caminho. Agora o desafio é manter esse ritmo numa prova completa, com tempo e com os pesos do edital.']
            : s >= 6 ? ['Bom resultado', 'Você acertou a maior parte, mas ' + (n - s) + ' erros em 10 questões, numa prova real, podem custar a vaga.']
            : ['Agora você sabe onde focar', 'Errar aqui é bom: é treino. Veja nas explicações o que caiu e revise esses assuntos antes da prova.'];
    ev('GratisConcluido', { concurso: k, rodada: rod + 1, acertos: s });
    function desenhar() {
      var extra = rod < 2 ? blocoLiberar(k, rod + 1) : '<div class="libera ok"><div class="h3">Você fez as 30 questões grátis de ' + esc(nomeDe(k)) + '</div><p>Para continuar treinando, o simulado completo tem a prova inteira no formato do edital.</p></div>';
      app.innerHTML = '<div class="res">' +
        '<div class="ring"><svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true"><circle cx="66" cy="66" r="56" fill="none" stroke="#E3E7F0" stroke-width="12"/>' +
        '<circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="' + cor + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg><b>' + s + '/' + n + '</b></div>' +
        '<h2>' + msg[0] + '</h2><p class="muted">' + msg[1] + '</p>' +
        '<div class="mini">' + st.hist.map(function (ok, i) { return '<span style="background:' + (ok ? '#15803D' : '#DC2626') + '">' + (i + 1) + '</span>'; }).join('') + '</div>' +
        extra + blocoSeguir() + blocoCompleto(k) +
        '<button type="button" class="linkbtn" id="outro">Fazer com outro concurso</button></div>';
      requestAnimationFrame(function () { requestAnimationFrame(function () { var a = $('arc'); if (a) a.style.strokeDashoffset = C * (1 - s / n); }); });
      if (rod < 2) ligarLiberar(k, rod + 1, desenhar);
      ligarComuns(k);
    }
    desenhar(); topo();
    if (rod < 2 && liberadas < rod + 1) verificar(function () { if (liberadas >= rod + 1) desenhar(); });
  }

  function telaLiberar(k, rod) {
    function desenhar() {
      app.innerHTML = '<div class="res"><div class="qtop" style="justify-content:center"><span class="qsub">' + esc(nomeDe(k)) + ' · ' + (rod * 10) + ' de 30 questões feitas</span></div>' +
        blocoLiberar(k, rod) + blocoSeguir() + blocoCompleto(k) +
        '<button type="button" class="linkbtn" id="outro">Escolher outro concurso</button></div>';
      ligarLiberar(k, rod, desenhar); ligarComuns(k);
    }
    desenhar(); topo();
    verificar(function () { if (liberadas >= rod) desenhar(); });
  }

  function fim(k) {
    app.innerHTML = '<div class="res"><div class="libera ok"><div class="h3">Você já fez as 30 questões grátis de ' + esc(nomeDe(k)) + '</div><p>Para continuar treinando, o simulado completo tem a prova inteira no formato do edital.</p></div>' +
      blocoSeguir() + blocoCompleto(k) + '<button type="button" class="linkbtn" id="outro">Escolher outro concurso</button></div>';
    ligarComuns(k); topo();
  }

  function ligarComuns(k) {
    if ($('seguir')) $('seguir').onclick = function () { ev('GratisSeguir', { concurso: k }); };
    if ($('completo')) $('completo').onclick = function () { ev('GratisQuerCompleto', { concurso: k }); };
    if ($('outro')) $('outro').onclick = escolha;
  }

  var k0 = params.get('c');
  if (k0 && DADOS[k0]) abrir(k0); else escolha();
  verificar(function () {});
})();
