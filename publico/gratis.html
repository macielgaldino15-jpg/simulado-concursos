.mini span{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}

(function () {
  var DADOS = {"cmrb":[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o acento indicativo de crase está empregado corretamente:","o":["O vereador começou à discursar logo após o intervalo regimental da sessão.","Encaminhamos o ofício à Vossa Excelência para conhecimento e providências.","O vereador votou à favor do projeto de lei apresentado pela Mesa.","A sessão foi encerrada à duas horas da tarde, após longa discussão.","O servidor entregou o requerimento à secretária da Mesa Diretora."],"c":4,"w":"Entregar algo \"a alguém\" (preposição) + \"a secretária\" (artigo) = à. Não há crase antes de verbo (a discursar), antes de pronome de tratamento (a Vossa Excelência) e na expressão \"a favor\"; com horas no plural, seria \"às duas horas\"."},{"s":"Língua Portuguesa","t":"Assinale a opção em que a frase apresenta paralelismo sintático adequado:","o":["O candidato gosta de ler livros, de escrever artigos e frequentar debates.","O chefe orientou a equipe a cumprir os prazos e a manter a organização.","O projeto exige dedicação, responsabilidade e que haja pontualidade.","O setor busca profissionais competentes, honestos e que tenham compromisso.","Precisamos analisar os custos, os prazos e verificar a viabilidade."],"c":1,"w":"O paralelismo sintático exige que elementos coordenados tenham a mesma estrutura gramatical. A alternativa B mantém a regência simétrica ('a cumprir' e 'a manter')."},{"s":"Raciocínio Lógico","t":"Numa progressão geométrica (PG) em que o primeiro termo é 2 e a razão é 3, a soma dos 4 primeiros termos é igual a:","o":["40","60","100","120","80"],"c":4,"w":"Termos da PG: 1º=2, 2º=6, 3º=18, 4º=54. Soma = 2 + 6 + 18 + 54 = 80."},{"s":"Noções de Informática","t":"No navegador, ao baixar um arquivo, ele normalmente é salvo, por padrão, na pasta:","o":["Windows","Lixeira","Área de transferência","Arquivos de Programas","Downloads"],"c":4,"w":"A pasta Downloads é o destino padrão dos arquivos baixados. O local pode ser alterado nas configurações do navegador."},{"s":"Ética no Serviço Público e Legislação","t":"Assinale a conduta adequada ao uso ético e seguro de tecnologias digitais por um servidor público:","o":["salvar processos com dados pessoais em pendrive particular sem proteção, para trabalhar em casa","compartilhar a senha do sistema com estagiários do setor para agilizar o trabalho de rotina","enviar documentos internos por aplicativo pessoal sem autorização","utilizar apenas sistemas e contas institucionais autorizados para tratar documentos do órgão","desativar o antivírus para instalar programas não homologados"],"c":3,"w":"Usar ferramentas autorizadas, não compartilhar credenciais e proteger os dados são medidas básicas de segurança da informação no serviço público."},{"s":"Ética no Serviço Público e Legislação","t":"Para a LGPD, \"tratamento\" de dados pessoais abrange:","o":["apenas a venda de dados a terceiros, já que o uso interno pela própria organização não é considerado tratamento","apenas o armazenamento em computadores e servidores, excluídos os dados mantidos em documentos de papel","toda operação realizada com dados pessoais, como coleta, armazenamento, compartilhamento e eliminação","somente a coleta inicial dos dados","somente a transferência internacional de dados, ou seja, o envio de informações para fora do território nacional"],"c":2,"w":"O art. 5º, X, define tratamento de forma ampla: coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, entre outras operações."},{"s":"Conhecimentos Específicos","t":"Segundo a Constituição Federal, a investidura em cargo ou emprego público depende, em regra, de:","o":["aprovação prévia em concurso público de provas ou de provas e títulos","entrevista com o chefe do setor e análise do histórico profissional do candidato","apresentação de currículo e carta de recomendação, seguida de análise da chefia","indicação da autoridade competente, desde que o indicado tenha nível superior completo","sorteio público entre os inscritos que comprovarem a escolaridade exigida para o cargo"],"c":0,"w":"O art. 37, II, exige concurso público, ressalvadas as nomeações para cargos em comissão declarados em lei de livre nomeação e exoneração."},{"s":"Conhecimentos Específicos","t":"O órgão diretor dos trabalhos legislativos e dos serviços administrativos da Câmara, normalmente composto por Presidente, Vice-Presidente e Secretários, é a:","o":["Corregedoria do Tribunal de Contas","Procuradoria-Geral do Município","Mesa Diretora","Comissão de Finanças","Ouvidoria"],"c":2,"w":"A Mesa Diretora dirige os trabalhos legislativos e a administração da Casa. Sua composição e competências estão no regimento interno."},{"s":"Conhecimentos Específicos","t":"A sanção de um projeto de lei aprovado pela Câmara Municipal é ato de competência:","o":["do Tribunal de Contas","do Presidente da Câmara","da Comissão de Constituição e Justiça","do Vereador autor do projeto","do Prefeito"],"c":4,"w":"A sanção (concordância) ou o veto (discordância) cabem ao chefe do Executivo, que no Município é o Prefeito."},{"s":"Conhecimentos Específicos","t":"A IMPESSOALIDADE na redação oficial significa que:","o":["o redator deve evitar pronomes de tratamento, dirigindo-se ao destinatário sempre pelo nome","o texto é emitido em nome do redator, que responde pessoalmente pelo conteúdo comunicado","o redator pode usar a primeira pessoa e expressar opiniões, desde que mantenha a formalidade","o texto é emitido em nome do serviço público, sem impressões pessoais do redator","o documento dispensa assinatura, pois é emitido em nome do órgão, e não de uma pessoa"],"c":3,"w":"A comunicação oficial é feita em nome do serviço público e trata de assuntos de interesse público, por isso evita impressões pessoais do redator. Isso não elimina os pronomes de tratamento nem a assinatura de quem expede o documento."}],"prf":[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a concordância verbal está correta:","o":["Vendem-se casas na região.","Consertam-se o carro da família.","Alugam-se um apartamento no centro.","Vende-se casas na região.","Precisam-se de funcionários."],"c":0,"w":"Na voz passiva sintética o verbo concorda com o sujeito paciente: “casas” (plural) → “Vendem-se casas”."},{"s":"Raciocínio Lógico","t":"A proposição composta 'Se o semáforo está vermelho, então o veículo para' só é FALSA quando:","o":["o semáforo está vermelho e o veículo para.","o semáforo não está vermelho e o veículo para.","o semáforo não está vermelho e o veículo não para.","o semáforo está vermelho e o veículo não para.","em nenhum caso; ela é sempre verdadeira."],"c":3,"w":"A condicional P → Q só é falsa quando o antecedente é verdadeiro e o consequente é falso (V → F)."},{"s":"Informática","t":"Em uma planilha, a função =SE(C2>=7;\"Aprovado\";\"Reprovado\"), com C2 igual a 6,5, retorna:","o":["um erro, pois a função não aceita decimais","6,5","Reprovado","VERDADEIRO","Aprovado"],"c":2,"w":"A função SE testa a condição C2 >= 7. Como 6,5 não é maior ou igual a 7, retorna o valor se falso: 'Reprovado'."},{"s":"Física","t":"Um veículo a 20 m/s freia com desaceleração constante de 5 m/s² até parar. A distância percorrida na frenagem é de:","o":["20 m","60 m","80 m","100 m","40 m"],"c":4,"w":"Por Torricelli: v² = 2·a·d → 400 = 10·d → d = 40 m."},{"s":"Legislação de Trânsito","t":"Segundo o art. 281, parágrafo único, II, do CTB, o auto de infração será arquivado e seu registro julgado insubsistente se a notificação da autuação não for expedida no prazo máximo de:","o":["90 dias.","15 dias.","60 dias.","30 dias.","180 dias."],"c":3,"w":"A autoridade tem 30 dias, contados da infração, para expedir a notificação de autuação. Ultrapassado esse prazo, o auto é arquivado."},{"s":"Direito Constitucional","t":"A Constituição Federal estabelece que a prática do racismo constitui crime:","o":["inafiançável e imprescritível.","inafiançável e prescritível.","afiançável e prescritível.","sujeito apenas a pena de multa.","afiançável e imprescritível."],"c":0,"w":"Art. 5º, XLII: a prática do racismo é crime inafiançável e imprescritível, sujeito à pena de reclusão."},{"s":"Direito Penal","t":"O agente que, voluntariamente, desiste de prosseguir na execução ou impede que o resultado se produza:","o":["responde com a pena reduzida pela metade.","só responde pelos atos já praticados.","responde pela tentativa do crime pretendido.","fica isento de qualquer responsabilidade, em todos os casos.","responde pelo crime consumado."],"c":1,"w":"É a desistência voluntária ou o arrependimento eficaz (art. 15 do CP). O agente não responde pela tentativa, mas pelos atos já praticados, se forem crimes."},{"s":"Direito Processual Penal","t":"Segundo o art. 322 do CPP, a autoridade policial poderá conceder fiança nos casos de infração cuja pena privativa de liberdade máxima não seja superior a:","o":["2 anos.","1 ano.","10 anos.","8 anos.","4 anos."],"c":4,"w":"Nos demais casos, a fiança é requerida ao juiz, que decide em 48 horas."},{"s":"Direito Administrativo","t":"NÃO é modalidade de licitação prevista na Lei nº 14.133/2021:","o":["Pregão.","Tomada de preços.","Leilão.","Diálogo competitivo.","Concorrência."],"c":1,"w":"A Lei nº 14.133/2021 prevê pregão, concorrência, concurso, leilão e diálogo competitivo. A tomada de preços e o convite deixaram de existir."},{"s":"Direitos Humanos","t":"A característica dos direitos humanos segundo a qual eles se aplicam a todas as pessoas, independentemente de nacionalidade, sexo, raça, religião ou qualquer outra condição, é a:","o":["disponibilidade.","relatividade cultural absoluta.","universalidade.","temporariedade.","exclusividade."],"c":2,"w":"Os direitos humanos são universais, indivisíveis, interdependentes, inalienáveis, imprescritíveis e irrenunciáveis, entre outras características."}],"adm":[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a palavra \"mesmo\" está corretamente empregada:","o":["Nós mesmo, as servidoras, fizemos.","Elas mesmas fizeram o relatório.","Elas mesmos fizeram o relatório.","Ele mesma fez o relatório.","Ela mesmos fez o relatório."],"c":1,"w":"\"Mesmo\", com valor de reforço (= próprio), concorda com o termo a que se refere. Como advérbio (= realmente), é invariável."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a regência do verbo \"assistir\" está de acordo com a norma-padrão:","o":["Os servidores assistiram a palestra sobre segurança viária.","Os servidores assistiram com a palestra sobre segurança viária.","Os servidores assistiram à palestra sobre segurança viária.","Os servidores assistiram na palestra sobre segurança viária.","Os servidores assistiram da palestra sobre segurança viária."],"c":2,"w":"\"Assistir\", no sentido de ver ou presenciar, é transitivo indireto e exige a preposição \"a\". No sentido de prestar assistência, é transitivo direto: \"o médico assistiu o ferido\"."},{"s":"Ética e Conduta Pública","t":"A afirmação \"aquilo que uma sociedade considera aceitável pode mudar com o tempo\" refere-se mais diretamente ao caráter:","o":["exclusivamente individual da ética","imutável dos valores éticos","técnico da administração pública","histórico e cultural da moral","absoluto da legislação penal"],"c":3,"w":"As normas morais variam conforme a época e o grupo social."},{"s":"Raciocínio Lógico","t":"A bicondicional \"p ↔ q\" é verdadeira quando:","o":["p é verdadeira, qualquer que seja q","apenas q é falsa","apenas p é verdadeira","p e q têm valores lógicos diferentes","p e q têm o mesmo valor lógico"],"c":4,"w":"A bicondicional é verdadeira quando ambas são verdadeiras ou ambas são falsas."},{"s":"Noções de Direito Constitucional","t":"Quanto à forma, a Constituição Federal de 1988 é classificada como:","o":["histórica","não escrita","escrita","consuetudinária","costumeira"],"c":2,"w":"A CF/1988 é um texto codificado e sistematizado, por isso é escrita."},{"s":"Noções de Direito Administrativo","t":"A distribuição interna de competências entre órgãos de uma mesma pessoa jurídica, com hierarquia, denomina-se:","o":["terceirização","delegação legislativa","desconcentração","descentralização","privatização"],"c":2,"w":"Na desconcentração, cria-se um órgão dentro da mesma pessoa. Na descentralização, transfere-se a atividade a outra pessoa jurídica."},{"s":"Noções de Administração","t":"Na EaD, a comunicação que ocorre ao mesmo tempo, em tempo real, como em uma videoconferência ao vivo, é chamada de:","o":["unidirecional, obrigatoriamente","assíncrona","off-line","síncrona","presencial"],"c":3,"w":"Comunicação síncrona acontece em tempo real. A assíncrona, como fóruns e e-mails, permite interação em momentos diferentes."},{"s":"Noções de Arquivologia","t":"Na diplomática e na arquivística, ata, ofício, certidão e requerimento são exemplos de:","o":["formatos","gêneros iconográficos","suportes","fundos","espécies documentais"],"c":4,"w":"A espécie é a configuração que o documento assume segundo a disposição e a natureza das informações. Somada à atividade, forma o tipo documental, como \"ata de reunião de comissão\"."},{"s":"Noções de Informática","t":"O formato de arquivo padrão do LibreOffice Writer é o:","o":[".docx",".odp",".txt",".ods",".odt"],"c":4,"w":"O Writer usa o formato aberto ODF de texto (.odt). O Calc usa .ods e o Impress, .odp."},{"s":"Legislação Relativa à PRF","t":"Conforme o art. 144, § 2º, da Constituição Federal, a Polícia Rodoviária Federal é órgão permanente, organizado e mantido pela União e estruturado em carreira, que se destina, na forma da lei:","o":["à apuração de infrações penais militares","ao patrulhamento ostensivo das ferrovias federais","à polícia marítima, aeroportuária e de fronteiras","ao patrulhamento ostensivo das rodovias federais","às funções de polícia judiciária da União"],"c":3,"w":"O § 2º atribui à PRF o patrulhamento ostensivo das rodovias federais. Polícia judiciária da União e polícia de fronteiras são funções da Polícia Federal (§ 1º); as ferrovias cabem à Polícia Ferroviária Federal (§ 3º)."}],"pet":[{"s":"Língua Portuguesa","t":"Leia:\n\"A manutenção preditiva não elimina a necessidade de intervenções, mas permite programá-las no momento mais oportuno, reduzindo paradas não planejadas.\"\nInfere-se do texto que a manutenção preditiva:","o":["contribui para planejar as intervenções e evitar paradas inesperadas.","aumenta o número de paradas não planejadas.","substitui completamente a manutenção corretiva emergencial em todos os casos.","torna desnecessária qualquer intervenção nos equipamentos.","é aplicada somente após a quebra do equipamento."],"c":0,"w":"O texto afirma que a preditiva 'não elimina' as intervenções, mas permite 'programá-las', reduzindo paradas não planejadas. As demais alternativas contradizem ou extrapolam o trecho."},{"s":"Língua Portuguesa","t":"Assinale a frase correta quanto à concordância nominal.","o":["Seguem anexas as notas fiscais e o certificado de calibração.","É proibido a entrada de pessoas sem crachá na sala de controle.","Segue anexo as notas fiscais e o certificado de calibração.","As operadoras disseram que elas mesmo fariam a medição.","Havia bastante equipamentos aguardando manutenção."],"c":0,"w":"'Anexo' é adjetivo e concorda com o substantivo: 'Seguem anexas as notas' (concordância com o mais próximo, no feminino plural). 'É proibida a entrada' — quando o substantivo vem determinado por artigo, o predicativo concorda. 'Elas mesmas' e 'bastantes equipamentos' (bastante como adjetivo = muitos) também variam."},{"s":"Língua Portuguesa","t":"Em qual das alternativas o verbo 'haver' foi empregado de forma INCORRETA quanto à concordância?","o":["Há anos o terminal não registra acidentes com afastamento.","Deve haver sobressalentes suficientes no almoxarifado.","Havia, no pátio, dezenas de tubos aguardando inspeção.","Os operadores haviam concluído a partida antes do fim do turno.","Houveram atrasos significativos na entrega dos equipamentos."],"c":4,"w":"No sentido de 'existir' ou 'ocorrer', 'haver' é impessoal e fica no singular: 'Houve atrasos'. Como auxiliar de tempo composto ('haviam concluído'), ele concorda normalmente com o sujeito. 'Há anos' indica tempo decorrido e também é impessoal."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o emprego de 'onde' está de acordo com a norma-padrão.","o":["A refinaria onde trabalho fica em São José dos Campos.","Houve uma época onde o petróleo era barato.","Foi uma reunião onde todos opinaram.","O relatório mostrou falhas, onde concluímos que o sensor estava descalibrado.","É uma situação onde não há saída fácil."],"c":0,"w":"'Onde' deve referir-se a lugar físico (a refinaria). Para reunião, época ou situação, usam-se 'em que' ou 'na qual'. Também não se usa 'onde' como conectivo conclusivo ('do que concluímos')."},{"s":"Matemática","t":"O preço do óleo diesel subiu de R$ 5,60 para R$ 6,16 por litro. O aumento foi de:","o":["56%","10%","9,1%","5,6%","11%"],"c":1,"w":"Aumento = 6,16 − 5,60 = 0,56. Percentual = 0,56 ÷ 5,60 = 0,10 = 10%."},{"s":"Matemática","t":"Em um mapa de instalações na escala 1:2.500, a distância entre dois tanques é de 8 cm. A distância real entre eles é:","o":["312,5 metros","20 metros","250 metros","2.000 metros","200 metros"],"c":4,"w":"Na escala 1:2.500, cada 1 cm no mapa corresponde a 2.500 cm reais. 8 × 2.500 = 20.000 cm = 200 m."},{"s":"Matemática","t":"Se 3 kg de eletrodo são suficientes para 45 metros de solda, quantos quilos são necessários para 120 metros?","o":["7,5 kg","8 kg","9 kg","6 kg","12 kg"],"c":1,"w":"Consumo de 3 ÷ 45 = 1/15 kg por metro. Para 120 m: 120 ÷ 15 = 8 kg."},{"s":"Conhecimentos Específicos","t":"Um trocador de calor tem a temperatura do fluido quente caindo de 150 °C para 90 °C e a do fluido frio subindo de 30 °C para 70 °C, em contracorrente. As diferenças de temperatura nas extremidades são:","o":["60 °C e 40 °C","80 °C e 60 °C","90 °C e 70 °C","150 °C e 30 °C","120 °C e 20 °C"],"c":1,"w":"Em contracorrente, a entrada do quente encontra a saída do frio: 150 − 70 = 80 °C. Na outra ponta, a saída do quente encontra a entrada do frio: 90 − 30 = 60 °C. A MLDT = (80 − 60)/ln(80/60) ≈ 69,5 °C."},{"s":"Conhecimentos Específicos","t":"A unidade de recuperação de enxofre (URE), que utiliza o processo Claus, converte:","o":["CO₂ em carbonato de cálcio.","mercaptanas em gasolina.","enxofre em ácido sulfúrico concentrado.","H₂S em enxofre elementar.","SO₂ em H₂S."],"c":3,"w":"No processo Claus, parte do H₂S é queimada formando SO₂, que reage com o H₂S restante em reatores catalíticos, produzindo enxofre elementar líquido e água."},{"s":"Conhecimentos Específicos","t":"O GLP (gás liquefeito de petróleo) é composto principalmente por:","o":["metano e etano.","hidrogênio e monóxido de carbono.","propano e butano.","benzeno e tolueno.","pentano e hexano."],"c":2,"w":"O GLP é uma mistura de hidrocarbonetos de 3 e 4 carbonos (propano e butano), que se liquefazem sob pressão moderada à temperatura ambiente. O metano é o principal componente do gás natural."}],"pc":[{"s":"Língua Portuguesa","t":"Assinale a alternativa que apresenta um período composto por coordenação sindética adversativa.","o":["O suspeito tentou fugir, mas foi detido pelos policiais.","O investigador analisou as provas e concluiu o inquérito.","Ou o meliante se entrega, ou a polícia invadirá o local.","O perito examinou o local, portanto o laudo será emitido logo.","Estude muito, porque o concurso da Polícia Civil é concorrido."],"c":0,"w":"A conjunção 'mas' liga orações coordenadas exprimindo oposição (adversativa)."},{"s":"Língua Portuguesa","t":"Assinale a alternativa em que a palavra destacada tem valor restritivo.","o":["O perito criminal, **que** é especialista em balística, analisou a arma.","O policial civil, **cujo** distintivo foi furtado, registrou boletim.","Os suspeitos, **que** fugiram em um carro preto, foram capturados.","O delegado, **que** coordenou a operação, foi elogiado.","Os investigadores **que** participaram da operação receberam medalha."],"c":4,"w":"A oração sem vírgulas ('que participaram da operação') restringe o universo dos investigadores aos que participaram da ação específica. As demais são explicativas (isoladas por vírgulas)."},{"s":"Direito Penal","t":"O funcionário público que retarda ou deixa de praticar ato de ofício, indevidamente, para satisfazer interesse ou sentimento pessoal, comete o crime de:","o":["Concussão.","Corrupção passiva.","Condescendência criminosa.","Advocacia administrativa.","Prevaricação."],"c":4,"w":"Prevaricação (art. 319 do CP): retardar ou omitir ato de ofício, ou praticá-lo contra expressa disposição de lei, para satisfazer interesse ou sentimento pessoal."},{"s":"Direito Penal","t":"Subtrair coisa alheia móvel, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência, caracteriza o crime de:","o":["Furto qualificado.","Extorsão.","Roubo.","Apropriação indébita.","Estelionato."],"c":2,"w":"Definição legal do crime de Roubo (art. 157 do CP)."},{"s":"Direito Processual Penal","t":"O inquérito policial, procedimento administrativo inquisitório conduzido pela Polícia Judiciária, tem como uma de suas características principais:","o":["Garantir o contraditório e a ampla defesa em sua plenitude durante todas as oitivas.","Ser imprescritível e indispensável para a propositura de qualquer ação penal.","Ser sigiloso, inquisitivo, dispensável, escrito e oficial.","Ser da competência exclusiva dos juízes de direito das varas criminais.","Exigir a presença obrigatória de defensor constituído para o indiciado em todos os atos."],"c":2,"w":"O inquérito policial é inquisitivo (não há contraditório amplo), dispensável (se a denúncia já tiver base em outras provas), escrito, sigiloso e oficial."},{"s":"Direito Processual Penal","t":"O flagrante preparado (delito putativo por obra do agente provocador), consagrado na jurisprudência pátria (Súmula 145 do STF):","o":["Torna o crime perfeitamente válido e enseja condenação severa.","É lícito quando autorizado pelo delegado de polícia.","Valida a prisão em flagrante se houver consentimento da vítima.","Aplica-se apenas aos crimes hediondos.","É considerado crime impossível, tornando a conduta atípica."],"c":4,"w":"Súmula 145 do STF: 'Não há crime quando a preparação do flagrante pela polícia torna impossível a sua consumação.' (Crime impossível)."},{"s":"Direito Constitucional","t":"O mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional, organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos:","o":["6 meses.","2 anos.","5 anos.","3 anos.","1 ano."],"c":4,"w":"Requisito temporal para impetração de mandado de segurança coletivo por associação: em funcionamento há pelo menos 1 ano (art. 5°, LXX, b, da CF)."},{"s":"Direito Constitucional","t":"A competência para legislar privativamente sobre direito penal, processual penal, civil e eleitoral é:","o":["Exclusiva dos Municípios.","Concorrente entre Estados e União.","Privativa da União.","Comum entre União, Estados e Distrito Federal.","Facultativa aos Estados-membros."],"c":2,"w":"Art. 22, I, da CF: Compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho."},{"s":"Direito Administrativo","t":"O ato administrativo que apresenta vício insanável no objeto (por ser impossível ou ilícito) ou na finalidade (desvio de poder) é considerado:","o":["Perfeitamente válido e sanável por ratificação.","Anulável, produzindo efeitos até que o juiz o declare inválido.","Inexistente sem repercussão jurídica.","Nulo, não podendo ser convalidado.","Meramente irregular."],"c":3,"w":"O ato com vício insanável no objeto, motivo ou finalidade é nulo e não admite convalidação (ao contrário de incompetência em razão do lugar e vício de forma, que podem ser convalidados se não forem essenciais)."},{"s":"Noções de Informática","t":"Sobre computação em nuvem (Cloud Computing), o modelo de serviço em que a infraestrutura completa (servidores, redes, armazenamento) é alugada e disponibilizada para que o usuário instale sistemas operacionais e aplicações próprias denomina-se:","o":["SaaS (Software as a Service).","IaaS (Infrastructure as a Service).","PaaS (Platform as a Service).","DaaS (Desktop as a Service estrito).","NaaS (Network as a Service isolado)."],"c":1,"w":"IaaS (Infraestrutura como Serviço) fornece recursos computacionais básicos de infraestrutura (máquinas virtuais, armazenamento, redes)."}]};

    if ($('trocar')) $('trocar').onclick = escolha;
  }

  function resultado() {
    var n = st.q.length, s = st.score, C = 2 * Math.PI * 56;
    var cor = s >= 8 ? '#15803D' : s >= 6 ? '#1E6FD9' : '#C2410C';

    app.innerHTML = '<div class="res">' +

      '<h2>' + msg[0] + '</h2><p class="muted">' + msg[1] + '</p>' +
      '<div class="mini">' + st.hist.map(function (ok, i) { return '<span style="background:' + (ok ? '#15803D' : '#DC2626') + '">' + (i + 1) + '</span>'; }).join('') + '</div>' +
      '<a class="btn ig" id="seguir" href="https://www.instagram.com/' + INSTA + '/" target="_blank" rel="noopener">Seguir @' + INSTA + '</a><p class="muted" style="margin-top:8px;font-size:13px">Questões novas toda semana no perfil</p>' +
