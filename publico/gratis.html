.opts{display:grid;gap:9px;margin-top:16px}

.opt:hover:not(:disabled){border-color:#1E6FD9;background:#F5F9FF}
.opt b{color:#1E5FC2;min-width:18px}.opt span{flex:1}.opt i{font-style:normal;font-weight:700}
.opt.ok{border-color:#15803D;background:#F0FDF4}.opt.ok i{color:#15803D}
.opt.bad{border-color:#DC2626;background:#FEF2F2}.opt.bad i{color:#DC2626}

.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:#F4F6FA;font-size:14px;line-height:1.5;color:#334155}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:16px;border:none;border-radius:14px;font:700 16px Inter,sans-serif;cursor:pointer;text-decoration:none}

.btn.ig{background:linear-gradient(90deg,#833AB4,#E1306C,#F77737);color:#fff}

.linkbtn{display:block;margin:14px auto 0;background:none;border:none;color:#64748B;font:500 14px Inter,sans-serif;text-decoration:underline;cursor:pointer}

.box{margin-top:18px;padding:16px;border-radius:14px;background:#0A1830;color:#fff;text-align:left}

.mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.mini span{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
body.emquiz .top h1,body.emquiz .top .sub,body.emquiz .top .pill{display:none}
body.emquiz .top{padding-bottom:76px}
.libera{margin-top:18px;padding:16px;border-radius:14px;border:2px dashed #F5B800;background:#FFFBEB;text-align:left}
.libera.ok{border-style:solid;border-color:#15803D;background:#F0FDF4}
.libera p{color:#334155;font-size:14px;line-height:1.5;margin-top:6px}
.libera .btn{margin-top:12px}
.aguarda{font-size:13px!important;color:#64748B!important;text-align:center;margin-top:10px!important}

(function () {
  var DADOS = {"cmrb":[[{"s":"Língua Portuguesa","t":"Assinale a alternativa em que o acento indicativo de crase está empregado corretamente:","o":["O vereador começou à discursar logo após o intervalo regimental da sessão.","Encaminhamos o ofício à Vossa Excelência para conhecimento e providências.","O vereador votou à favor do projeto de lei apresentado pela Mesa.","A sessão foi encerrada à duas horas da tarde, após longa discussão.","O servidor entregou o requerimento à secretária da Mesa Diretora."],"c":4,"w":"Entregar algo \"a alguém\" (preposição) + \"a secretária\" (artigo) = à. Não há crase antes de verbo (a discursar), antes de pronome de tratamento (a Vossa Excelência) e na expressão \"a favor\"; com horas no plural, seria \"às duas horas\"."},{"s":"Língua Portuguesa","t":"Assinale a opção em que a frase apresenta paralelismo sintático adequado:","o":["O candidato gosta de ler livros, de escrever artigos e frequentar debates.","O chefe orientou a equipe a cumprir os prazos e a manter a organização.","O projeto exige dedicação, responsabilidade e que haja pontualidade.","O setor busca profissionais competentes, honestos e que tenham compromisso.","Precisamos analisar os custos, os prazos e verificar a viabilidade."],"c":1,"w":"O paralelismo sintático exige que elementos coordenados tenham a mesma estrutura gramatical. A alternativa B mantém a regência simétrica ('a cumprir' e 'a manter')."},{"s":"Raciocínio Lógico","t":"Numa progressão geométrica (PG) em que o primeiro termo é 2 e a razão é 3, a soma dos 4 primeiros termos é igual a:","o":["40","60","100","120","80"],"c":4,"w":"Termos da PG: 1º=2, 2º=6, 3º=18, 4º=54. Soma = 2 + 6 + 18 + 54 = 80."},{"s":"Noções de Informática","t":"No navegador, ao baixar um arquivo, ele normalmente é salvo, por padrão, na pasta:","o":["Windows","Lixeira","Área de transferência","Arquivos de Programas","Downloads"],"c":4,"w":"A pasta Downloads é o destino padrão dos arquivos baixados. O local pode ser alterado nas configurações do navegador."},{"s":"Ética no Serviço Público e Legislação","t":"Assinale a conduta adequada ao uso ético e seguro de tecnologias digitais por um servidor público:","o":["salvar processos com dados pessoais em pendrive particular sem proteção, para trabalhar em casa","compartilhar a senha do sistema com estagiários do setor para agilizar o trabalho de rotina","enviar documentos internos por aplicativo pessoal sem autorização","utilizar apenas sistemas e contas institucionais autorizados para tratar documentos do órgão","desativar o antivírus para instalar programas não homologados"],"c":3,"w":"Usar ferramentas autorizadas, não compartilhar credenciais e proteger os dados são medidas básicas de segurança da informação no serviço público."},{"s":"Ética no Serviço Público e Legislação","t":"Para a LGPD, \"tratamento\" de dados pessoais abrange:","o":["apenas a venda de dados a terceiros, já que o uso interno pela própria organização não é considerado tratamento","apenas o armazenamento em computadores e servidores, excluídos os dados mantidos em documentos de papel","toda operação realizada com dados pessoais, como coleta, armazenamento, compartilhamento e eliminação","somente a coleta inicial dos dados","somente a transferência internacional de dados, ou seja, o envio de informações para fora do território nacional"],"c":2,"w":"O art. 5º, X, define tratamento de forma ampla: coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, entre outras operações."},{"s":"Conhecimentos Específicos","t":"Segundo a Constituição Federal, a investidura em cargo ou emprego público depende, em regra, de:","o":["aprovação prévia em concurso público de provas ou de provas e títulos","entrevista com o chefe do setor e análise do histórico profissional do candidato","apresentação de currículo e carta de recomendação, seguida de análise da chefia","indicação da autoridade competente, desde que o indicado tenha nível superior completo","sorteio público entre os inscritos que comprovarem a escolaridade exigida para o cargo"],"c":0,"w":"O art. 37, II, exige concurso público, ressalvadas as nomeações para cargos em comissão declarados em lei de livre nomeação e exoneração."},{"s":"Conhecimentos Específicos","t":"O órgão diretor dos trabalhos legislativos e dos serviços administrativos da Câmara, normalmente composto por Presidente, Vice-Presidente e Secretários, é a:","o":["Corregedoria do Tribunal de Contas","Procuradoria-Geral do Município","Mesa Diretora","Comissão de Finanças","Ouvidoria"],"c":2,"w":"A Mesa Diretora dirige os trabalhos legislativos e a administração da Casa. Sua composição e competências estão no regimento interno."},{"s":"Conhecimentos Específicos","t":"A sanção de um projeto de lei aprovado pela Câmara Municipal é ato de competência:","o":["do Tribunal de Contas","do Presidente da Câmara","da Comissão de Constituição e Justiça","do Vereador autor do projeto","do Prefeito"],"c":4,"w":"A sanção (concordância) ou o veto (discordância) cabem ao chefe do Executivo, que no Município é o Prefeito."},{"s":"Conhecimentos Específicos","t":"A IMPESSOALIDADE na redação oficial significa que:","o":["o redator deve evitar pronomes de tratamento, dirigindo-se ao destinatário sempre pelo nome","o texto é emitido em nome do redator, que responde pessoalmente pelo conteúdo comunicado","o redator pode usar a primeira pessoa e expressar opiniões, desde que mantenha a formalidade","o texto é emitido em nome do serviço público, sem impressões pessoais do redator","o documento dispensa assinatura, pois é emitido em nome do órgão, e não de uma pessoa"],"c":3,"w":"A comunicação oficial é feita em nome do serviço público e trata de assuntos de interesse público, por isso evita impressões pessoais do redator. Isso não elimina os pronomes de tratamento nem a assinatura de quem expede o documento."}],[{"s":"Língua Portuguesa","t":"A palavra \"pôde\" leva acento para:","o":["indicar que é proparoxítona","atender à regra que acentua as oxítonas terminadas em \"e\", como acontece em \"você\" e \"bebê\"","diferenciar o pretérito perfeito (\"ontem ele pôde\") do presente (\"hoje ele pode\")","marcar um hiato","indicar o plural"],"c":2,"w":"\"Pôde\" mantém o acento diferencial, que distingue o passado (pôde) do presente (pode). O mesmo ocorre com \"pôr\" (verbo) e \"por\" (preposição)."},{"s":"Língua Portuguesa","t":"Expressões como \"Alô, está me ouvindo?\" e \"Bom dia, tudo bem?\" exemplificam a função da linguagem:","o":["poética","conativa","referencial","metalinguística","fática"],"c":4,"w":"A função fática serve para abrir, manter ou testar o canal de comunicação."},{"s":"Raciocínio Lógico","t":"Uma senha de acesso é formada por 3 algarismos distintos, escolhidos de 0 a 9. Quantas senhas diferentes podem ser formadas?","o":["504","120","1.000","720","30"],"c":3,"w":"Há 10 opções para o 1º algarismo, 9 para o 2º e 8 para o 3º: 10 × 9 × 8 = 720."},{"s":"Noções de Informática","t":"No Word, para que apenas uma página do documento fique em orientação paisagem e as demais continuem em retrato, deve-se:","o":["mudar o tamanho da fonte e as margens apenas da página que deve ficar na orientação paisagem","inserir uma quebra de página e mudar a orientação do documento inteiro","inserir uma tabela com largura maior que a página, para forçar automaticamente a mudança de orientação","aplicar uma marca d'água na página e girar o conteúdo em 90 graus pela guia Design do Word","inserir quebras de seção antes e depois da página e alterar a orientação só dessa seção"],"c":4,"w":"Configurações de página, como orientação e margens, valem por seção. Quebras de seção isolam a página para que só ela fique em paisagem."},{"s":"Ética no Serviço Público e Legislação","t":"Segundo a LAI, a informação classificada como RESERVADA terá restrição de acesso pelo prazo máximo de:","o":["2 anos","10 anos","15 anos","5 anos","25 anos"],"c":3,"w":"O prazo máximo para a informação reservada é de 5 anos (art. 24, § 1º, III)."},{"s":"Ética no Serviço Público e Legislação","t":"Na Lei nº 9.784/1999, que regula o processo administrativo federal (aplicada, em muitos casos, por analogia a estados e municípios), salvo disposição legal específica, o prazo para interposição de recurso administrativo é de:","o":["5 dias úteis, contados da assinatura da decisão pela autoridade competente.","15 dias, contados da publicação da decisão no diário oficial do estado.","30 dias, contados do fim do processo.","10 dias, contados da ciência ou divulgação oficial da decisão.","48 horas, contadas da notificação pessoal do interessado no processo."],"c":3,"w":"O art. 59 da Lei nº 9.784/1999 fixa 10 dias para recorrer, salvo disposição legal específica. O recurso é dirigido à autoridade que proferiu a decisão, que pode reconsiderá-la em 5 dias."},{"s":"Conhecimentos Específicos","t":"Após o veto, o projeto volta ao Legislativo, que pode mantê-lo ou rejeitá-lo. Se o veto for rejeitado, o projeto:","o":["é enviado ao Tribunal de Justiça, que decide se ele vira lei","perde a validade e precisa ser reapresentado na sessão seguinte","é arquivado definitivamente","volta para nova votação em dois turnos, com quórum qualificado","é enviado para promulgação, transformando-se em lei"],"c":4,"w":"Derrubado o veto, o projeto segue para promulgação. Se o chefe do Executivo não promulgar no prazo, a promulgação cabe ao Presidente do Legislativo."},{"s":"Conhecimentos Específicos","t":"O período de quatro anos correspondente ao mandato dos Vereadores é chamado de:","o":["legislatura","sessão legislativa","sessão ordinária","expediente","interstício"],"c":0,"w":"Legislatura é o período de quatro anos do mandato. A sessão legislativa é o período anual de funcionamento da Câmara."},{"s":"Conhecimentos Específicos","t":"Para representar graficamente a sequência de etapas do trâmite de um requerimento, desde o protocolo até a resposta ao cidadão, utiliza-se o:","o":["organograma","fluxograma","mapa de calor","gráfico de pizza","cronograma"],"c":1,"w":"O fluxograma representa as etapas, as decisões e o caminho percorrido em um processo de trabalho."},{"s":"Conhecimentos Específicos","t":"No processo disciplinar regido pela Lei nº 1.794/2009, o indiciado será citado para apresentar defesa escrita no prazo de:","o":["30 dias, prorrogáveis indefinidamente","15 dias; havendo dois ou mais indiciados, o prazo será de 30 dias para cada um","10 dias; havendo dois ou mais indiciados, o prazo será comum e de 20 dias","48 horas","5 dias para qualquer número de indiciados"],"c":2,"w":"O art. 152, §§ 1º e 2º, fixa esses prazos, que podem ser prorrogados pelo dobro para diligências indispensáveis (§ 3º)."}],[{"s":"Língua Portuguesa","t":"O ditado \"Quem tem boca vai a Roma\" é usado para dizer que quem pergunta consegue chegar aonde quer. O sentido da frase é:","o":["literal, pois fala de uma viagem real até a capital da Itália","científico, pois descreve um fato comprovado por pesquisas","figurado, pois não se refere literalmente a viajar a Roma","técnico, pois vem da linguagem jurídica usada nos tribunais","denotativo, pois é usado nos dicionários com seu sentido próprio"],"c":2,"w":"Provérbios usam linguagem conotativa: \"ir a Roma\" representa atingir um objetivo."},{"s":"Língua Portuguesa","t":"Na frase \"Os servidores elegeram Maria presidente da comissão\", o termo \"presidente da comissão\" é:","o":["objeto indireto","aposto explicativo","predicativo do sujeito","predicativo do objeto","adjunto adverbial"],"c":3,"w":"\"Presidente da comissão\" atribui uma qualidade ao objeto direto \"Maria\". É predicativo do objeto."},{"s":"Raciocínio Lógico","t":"Em uma comissão, todo membro titular é vereador, e nenhum vereador é servidor efetivo da Câmara. Logo:","o":["algum membro titular pode ser servidor efetivo da Câmara","todo vereador é membro titular","algum servidor efetivo da Câmara é vereador e membro titular","nenhum membro titular é servidor efetivo da Câmara","todo servidor efetivo é membro titular"],"c":3,"w":"Os titulares estão dentro do conjunto dos vereadores, que não tem interseção com o dos servidores efetivos. Assim, nenhum titular é servidor efetivo."},{"s":"Noções de Informática","t":"No Google, a pesquisa \"relatório de gestão site:gov.br\" retorna:","o":["somente imagens publicadas em sites do governo federal","resultados de qualquer site, exceto os do domínio gov.br","somente arquivos em PDF hospedados em sites do governo","apenas notícias publicadas hoje","resultados apenas de páginas sob o domínio gov.br"],"c":4,"w":"O operador site: restringe a busca a um domínio. Para tipos de arquivo usa-se filetype:, por exemplo filetype:pdf."},{"s":"Ética no Serviço Público e Legislação","t":"A realização de concurso público para o provimento de cargos efetivos concretiza, principalmente, os princípios da:","o":["eficiência e do lucro, ao selecionar os candidatos que aceitam receber menos","impessoalidade e da moralidade, ao garantir igualdade de oportunidades","legalidade tributária e da anterioridade, ao exigir o pagamento da taxa de inscrição","autonomia e da hierarquia, ao permitir que cada chefe escolha sua equipe","publicidade e da soberania, ao divulgar o edital no Diário Oficial da União"],"c":1,"w":"O concurso permite que qualquer interessado concorra em igualdade de condições, afastando escolhas pessoais."},{"s":"Ética no Serviço Público e Legislação","t":"Um risco ético relevante no uso de sistemas de IA pela administração pública é:","o":["a reprodução de vieses dos dados de treinamento, gerando discriminação","a redução automática de custos operacionais, sem qualquer risco para os cidadãos","a eliminação de todos os erros humanos nas decisões tomadas pelos servidores","a dispensa da proteção de dados pessoais, já que os sistemas são automatizados","a garantia de imparcialidade absoluta, por se tratar de decisão tomada por máquina"],"c":0,"w":"Se os dados de treinamento contêm distorções, o sistema pode reproduzi-las, violando a impessoalidade e o princípio da não discriminação."},{"s":"Conhecimentos Específicos","t":"O documento que registra o resumo dos trabalhos de uma sessão, incluindo presenças, matérias discutidas e resultados das votações, é a:","o":["moção","ata","pauta","indicação","certidão"],"c":1,"w":"A ata é o registro fiel e resumido da sessão. Depois de lida e aprovada, é assinada conforme o regimento."},{"s":"Conhecimentos Específicos","t":"Na rotina do SIC, quando a informação pedida já está publicada no portal da transparência, o servidor pode:","o":["cobrar taxa pela pesquisa, já que a informação está disponível em meio público","indicar ao requerente, por escrito, o local e a forma de acessá-la","arquivar o pedido sem resposta, pois a informação já é pública","exigir que o requerente consulte o portal antes de apresentar novo pedido","responder somente se o requerente comparecer presencialmente ao SIC"],"c":1,"w":"A LAI (art. 11, § 6º) permite indicar, por escrito, o lugar e a forma de acessar a informação já disponível, desobrigando o órgão de fornecê-la diretamente, salvo se o requerente declarar não dispor de meios para acessá-la. O pedido não pode ficar sem resposta."},{"s":"Conhecimentos Específicos","t":"Na redação oficial, o campo \"Assunto\" do ofício deve:","o":["ficar em branco, para ser preenchido pelo destinatário","conter a assinatura do remetente","trazer o fecho do documento","resumir o teor do documento de forma objetiva","repetir o nome do destinatário"],"c":3,"w":"O assunto é um resumo breve do conteúdo, que facilita a identificação e o arquivamento do documento."},{"s":"Conhecimentos Específicos","t":"Seguindo o modelo do art. 58, § 3º, da Constituição Federal, uma Comissão Parlamentar de Inquérito (CPI) é criada mediante requerimento de:","o":["qualquer cidadão, por abaixo-assinado simples","metade mais um dos membros, para investigar qualquer assunto, sem prazo definido","dois terços dos mem edida no prazo máximo de:","o":["90 dias.","15 dias.","60 dias.","30 dias.","180 dias."],"c":3,"w":"A autoridade tem 30 dias, contados da infração, para expedir a notificação de autuação. Ultrapassado esse prazo, o auto é arquivado."},{"s":"Direito Constitucional","t":"A Constituição Federal estabelece que a prática do racismo constitui crime:","o":["inafiançável e imprescritível.","inafiançável e prescritível.","afiançável e prescritível.","sujeito apenas a pena de multa.","afiançável e imprescritível."],"c":0,"w":"Art. 5º, XLII: a prática do racismo é crime inafiançável e imprescritível, sujeito à pena de reclusão."},{"s":"Direito Penal","t":"O agente que, voluntariamente, desiste de prosseguir na execução ou impede que o resultado se produza:","o":["responde com a pena reduzida pela metade.","só responde pelos atos já praticados.","responde pela tentativa do crime pretendido.","fica isento de qualquer responsabilidade, em todos os casos.","responde pelo crime consumado."],"c":1,"w":"É a desistência voluntária ou o arrependimento eficaz (art. 15 do CP). O agente não responde pela tentativa, mas pelos atos já praticados, se forem crimes."},{"s":"Direito Processual Penal","t":"Segundo o art. 322 do CPP, a autoridade policial poderá conceder fiança nos casos de infração cuja pena privativa de liberdade máxima não seja superior a:","o":["2 anos.","1 ano.","10 anos.","8 anos.","4 anos."],"c":4,"w":"Nos demais casos, a fiança é requerida ao juiz, que decide em 48 horas."},{"s":"Direito Administrativo","t":"NÃO é modalidade de licitação prevista na Lei nº 14.133/2021:","o":["Pregão.","Tomada de preços.","Leilão.","Diálogo competitivo.","Concorrência."],"c":1,"w":"A Lei nº 14.133/2021 prevê pregão, concorrência, concurso, leilão e diálogo competitivo. A tomada de preços e o convite deixaram de existir."},{"s":"Direitos Humanos","t":"A característica dos direitos humanos segundo a qual eles se aplicam a todas as pessoas, independentemente de nacionalidade, sexo, raça, religião ou qualquer outra condição, é a:","o":["disponibilidade.","relatividade cultural absoluta.","universalidade.","temporariedade.","exclusividade."],"c":2,"w":"Os direitos humanos são universais, indivisíveis, interdependentes, inalienáveis, imprescritíveis e irrenunciáveis, entre outras características."}],[{"s":"Língua Portuguesa","t":"Em \"Brasília, capital federal, sedia a Direção-Geral da PRF\", o termo entre vírgulas é:","o":["um aposto explicativo.","um adjunto adverbial.","um predicativo do objeto.","o sujeito da oração.","um vocativo."],"c":0,"w":"'Capital federal' explica o termo 'Brasília', funcionando como aposto explicativo, isolado por vírgulas."},{"s":"Raciocínio Lógico","t":"Considere a proposição: “Se chove, então a pista fica escorregadia”. Sabendo que a pista não está escorregadia, conclui-se que:","o":["não choveu.","a pista ficará escorregadia.","chove e a pista está seca.","não é possível concluir nada.","choveu."],"c":0,"w":"Negando-se o consequente de uma condicional, nega-se o antecedente (modus tollens): se a pista não está escorregadia, não choveu."},{"s":"Raciocínio Lógico","t":"Quantos anagramas tem a palavra RADAR?","o":["20","120","30","60","10"],"c":2,"w":"RADAR tem 5 letras, com R e A repetidas duas vezes cada: 5! / (2! × 2!) = 120 / 4 = 30."},{"s":"Informática","t":"O recurso que filtra o tráfego entre redes com base em regras de segurança é o:","o":["firewall.","plotter.","compilador.","scanner.","driver."],"c":0,"w":"O firewall permite ou bloqueia conexões de acordo com regras previamente definidas."},{"s":"Física","t":"A energia cinética de um veículo de 1.000 kg que se move a 10 m/s é de:","o":["10.000 J","100.000 J","5.000 J","50.000 J","500.000 J"],"c":3,"w":"Ec = m·v² ÷ 2 = 1.000 × 100 ÷ 2 = 50.000 J."},{"s":"Física","t":"Qual a força resultante necessária para imprimir aceleração de 3 m/s² a um veículo de 1.000 kg?","o":["300 N","3.000 N","1.000 N","3.333 N","30.000 N"],"c":1,"w":"Segunda lei de Newton: F = m·a = 1.000 × 3 = 3.000 N."},{"s":"Direito Constitucional","t":"Segundo a Constituição, às polícias militares cabem:","o":["as funções de polícia marítima e aeroportuária.","as funções de polícia judiciária e a apuração de infrações penais.","a segurança dos estabelecimentos penais.","a polícia ostensiva e a preservação da ordem pública.","o patrulhamento ostensivo das rodovias federais."],"c":3,"w":"O §5º do art. 144 atribui às PMs a polícia ostensiva e a preservação da ordem pública. A apuração de infrações (exceto militares) cabe às polícias civis (§4º)."},{"s":"Direito Penal","t":"Subtrair, para si ou para outrem, coisa alheia móvel, sem violência ou grave ameaça, configura o crime de:","o":["receptação.","apropriação indébita.","estelionato.","furto.","roubo."],"c":3,"w":"Furto (art. 155): subtração sem violência ou grave ameaça. Com violência ou grave ameaça, é roubo (art. 157)."},{"s":"Direito Processual Penal","t":"O inquérito policial tem como características, entre outras, ser:","o":["escrito, sigiloso, inquisitivo e dispensável.","conduzido pelo juiz.","oral, público e contraditório.","arquivável pelo próprio delegado.","obrigatório para o oferecimento de qualquer denúncia."],"c":0,"w":"O inquérito é procedimento administrativo, escrito e inquisitivo, com sigilo necessário à investigação. É dispensável se o MP já tiver elementos. A autoridade policial não pode arquivá-lo (art. 17 do CPP)."},{"s":"Direito Administrativo","t":"Nos termos do art. 41 da Constituição Federal, o servidor nomeado para cargo de provimento efetivo em virtude de concurso público adquire estabilidade após:","o":["1 ano de efetivo exercício.","2 anos de efetivo exercício.","5 anos de efetivo exercício.","10 anos de efetivo exercício.","3 anos de efetivo exercício."],"c":4,"w":"São necessários três anos de efetivo exercício, além da avaliação especial de desempenho por comissão instituída para essa finalidade."}],[{"s":"Língua Portuguesa","t":"Em qual frase o uso do acento grave é FACULTATIVO?","o":["O policial chegou à rodovia cedo.","O policial entregou o laudo à chefe do posto.","O policial foi à Bahia na operação.","O policial entregou o laudo à sua chefe.","O policial saiu às pressas."],"c":3,"w":"Antes de pronome possessivo feminino singular, o artigo é opcional; por isso a crase também é: 'à sua chefe' ou 'a sua chefe'."},{"s":"Raciocínio Lógico","t":"Dentre 6 agentes, serão escolhidos um motorista e um comandante para a viatura. O número de formas de escolha é:","o":["30","15","12","720","36"],"c":0,"w":"As funções são distintas, então a ordem importa: arranjo A(6,2) = 6 × 5 = 30."},{"s":"Informática","t":"No Windows, ao excluir um arquivo com as teclas Shift + Delete:","o":["o arquivo é copiado para a área de transferência.","o arquivo é excluído sem passar pela Lixeira.","o arquivo vai para a Lixeira.","o arquivo é compactado.","o arquivo é renomeado."],"c":1,"w":"Shift + Delete exclui permanentemente, sem enviar à Lixeira (o sistema pede confirmação). A tecla Delete sozinha envia o arquivo para a Lixeira."},{"s":"Informática","t":"Mensagens falsas que se passam por instituições para induzir a pessoa a fornecer dados pessoais configuram o ataque conhecido como:","o":["Sniffing","Defacement","Backdoor","Phishing","Spooling"],"c":3,"w":"Phishing é a fraude que usa mensagens ou páginas falsas para obter dados da vítima."},{"s":"Física","t":"Se a velocidade de um veículo dobrar, mantida a mesma desaceleração, a distância de frenagem:","o":["cai pela metade.","quadruplica.","permanece igual.","dobra.","triplica."],"c":1,"w":"A distância de frenagem é proporcional ao quadrado da velocidade (d = v²/2a). Dobrando v, d fica 4 vezes maior."},{"s":"Legislação de Trânsito","t":"O órgão máximo executivo de trânsito da União, integrante do Sistema Nacional de Trânsito, é atualmente denominado:","o":["Secretaria Nacional de Trânsito (Senatran).","Departamento Estadual de Trânsito (Detran).","Conselho Estadual de Trânsito (Cetran).","Conselho Nacional de Trânsito (C
